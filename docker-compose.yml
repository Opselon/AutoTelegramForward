# Bounded container logs. The `json-file` driver is unbounded by default: the
# core container's log had reached 46 MB / 434k lines, and reading it back for a
# diagnosis took seconds. Cap and rotate instead of letting a log fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Optional shared Redis: the API boundary's rate-limit store and the Core's
  # worker-coordination leases. Internal-only networking (no published port on
  # the host), bounded memory, and no persistence on purpose — this instance
  # holds limits, leases and nothing durable: a value that survives a restart
  # would be a stale limit, so the store restarts empty and everyone re-buckets
  # from their current allowance. See docs/redis.md.
  #
  # Everything still works if you delete this service: the classes fall back
  # per policy (auth refuses, ordinary traffic degrades to a per-process
  # limit), the Core assumes it is the only replica. Removing the SERVICE is
  # the documented way to disable the integration.
  redis:
    image: redis:7.4.11-alpine3.21
    container_name: atf-redis
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${ATF_REDIS_MAXMEMORY:-256mb}
      # noeviction rather than allkeys-lru: silently evicting a token bucket
      # resets that scope's allowance, which a client can provoke by inventing
      # scopes until the cache churns. Refusing a write on pressure is a
      # limiter problem (it fails per the outage policy); evicting one is a
      # silent bypass.
      - --maxmemory-policy
      - ${ATF_REDIS_MAXMEMORY_POLICY:-noeviction}
      - --save
      - ""
      - --appendonly
      - "no"
      # Hard-bound the expiry housekeeping: 4000 keys per tick keeps eviction
      # from ever starving the command loop that the limiter runs on.
      - --hz
      - "20"
      - --notify-keyspace-events
      - ""
      # AUTH when a password is configured; the Go client and the Core pass the
      # same value through ATF_REDIS_PASSWORD.
      - --requirepass
      - ${ATF_REDIS_PASSWORD:-}
    # A credential is not optional here: an empty --requirepass upgrades every
    # connection to unauthenticated, and this network also carries the stack's
    # bots. The .env.example documents generating one; a blank value keeps the
    # generate-once default below honest.
    # (redis ignores an empty requirepass, so the guidance is in the docs.)
    # The probe runs inside the container, so the password must be present in
    # its environment for `redis-cli -a` — and this is the ONLY place the value
    # is exposed within the service, never to other services.
    environment:
      ATF_REDIS_PASSWORD: ${ATF_REDIS_PASSWORD:-}
    networks:
      - atf-net
    # Deliberately NO ports: nothing outside the stack's network may reach this.
    healthcheck:
      # redis-cli needs no extra package in the image. With a password set,
      # PING still works for authenticated clients; the check uses the
      # password via ATF_REDIS_PASSWORD when present.
      test: ["CMD-SHELL", "ATF_REDIS_PASSWORD=$$ATF_REDIS_PASSWORD redis-cli ${ATF_REDIS_PASSWORD:+-a $$ATF_REDIS_PASSWORD} ${ATF_REDIS_PASSWORD:+--no-auth-warning} ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Production logging engine (Rust, rust/logger). Promoted over the legacy
  # Python logger: the service name and the `logger:50052` address consumers use
  # are unchanged, so core/api needed no client change. Owns its own store
  # (logger-rust-data); the retired Python archive (atf-data/logger.db) is kept
  # intact as a historical record and is never written to again.
  logger:
    build:
      context: .
      dockerfile: Dockerfile.logger-rust
    container_name: atf-logger
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    environment:
      ATF_LOGGER_DB_PATH: /app/data/atf_logs_rust.db
      # Bound to all interfaces so the container healthcheck and an operator's
      # scrape both reach it; the crate's own default is loopback-only.
      ATF_LOGGER_METRICS_LISTEN: 0.0.0.0:9109
      # Capability gates for the gRPC surface: ingest (Log), read
      # (QueryLogs/LogStats), admin (PurgeLogs). Unset = that scope is open —
      # producers keep logging, previous behaviour. One token per capability:
      # a producer credential can never read the archive, and the API's read
      # credential cannot purge. Set them together with the consumers below
      # (core: ATF_LOGGER_INGEST_TOKEN; api: the read/admin pair) — arming one
      # side alone makes every call fail loudly with UNAUTHENTICATED.
      ATF_LOGGER_INGEST_TOKEN: ${ATF_LOGGER_INGEST_TOKEN:-}
      ATF_LOGGER_READ_TOKEN: ${ATF_LOGGER_READ_TOKEN:-}
      ATF_LOGGER_ADMIN_TOKEN: ${ATF_LOGGER_ADMIN_TOKEN:-}
      # Engine-side admission cap for DEBUG/INFO records per second; 0/unset =
      # off (default). WARN/ERROR/CRITICAL and audit/security categories always
      # bypass — this only bounds a verbose flood.
      ATF_LOGGER_ADMISSION_RATE: ${ATF_LOGGER_ADMISSION_RATE:-}
    volumes:
      - logger-rust-data:/app/data
    networks:
      - atf-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9109/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: atf-core
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - logger
    environment:
      # Supported gRPC-only mode (no bot, no Telegram login). The release smoke
      # test sets it: .env.example credentials cannot log in, and a core that
      # exits on the failed login restart-loops and SIGKILLs checks running
      # through `docker compose exec` (the v2.2.0 clean-install died at 137).
      ATF_DISABLE_BOT: ${ATF_DISABLE_BOT:-}
      ATF_API_ID: ${ATF_API_ID}
      ATF_API_HASH: ${ATF_API_HASH}
      ATF_BOT_TOKEN: ${ATF_BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-5094837833}
      ADMIN_IDS: ${ADMIN_IDS:-5094837833}
      ATF_ADMIN_USER_ID: ${ATF_ADMIN_USER_ID:-5094837833}
      ATF_MASTER_KEY: ${ATF_MASTER_KEY}
      # Session signing key.  Left unset, the core generates a random one and
      # keeps it in the database; set it to share sessions across a deployment
      # or to rotate.  It must never be a value anybody else can read: hashing
      # the database path (the old fallback) let anyone sign a token for any
      # account, because the path is in this file.
      ATF_JWT_SECRET: ${ATF_JWT_SECRET:-}
      # A tenant can point its own rewrite config at an endpoint it runs. The
      # core refuses an address it must not be made to call (loopback, cloud
      # metadata, this host's own networks) unless the operator declares the
      # private network theirs — set this when the AI provider lives beside the
      # stack on the compose network. Loopback and metadata stay refused either
      # way, so it is never a blanket "trust the tenant's URL".
      ATF_ALLOW_PRIVATE_AI_ENDPOINTS: ${ATF_ALLOW_PRIVATE_AI_ENDPOINTS:-}
      # Public dashboard URL the bot shows in its panel (e.g. https://panel.example.com
      # or http://203.0.113.10:8088). Inside Docker the container cannot detect
      # the host's public address, so set it here — or leave blank and configure
      # it from the bot's "Dashboard URL" button.
      ATF_WEB_URL: ${ATF_WEB_URL:-}
      ATF_GRPC_PORT: 50051
      # Shared credential on the core's gRPC surface. Every servicer takes the
      # acting tenant from owner_user_id in the request, so without it anything
      # that can reach core:50051 can act as any tenant. The API sends the same
      # value; set it in the env file (or both stay unset and the core warns at
      # startup). A mismatch fails every RPC with UNAUTHENTICATED, on purpose.
      ATF_CORE_RPC_TOKEN: ${ATF_CORE_RPC_TOKEN:-}
      # Terminal per-user task retention, seconds (default 30 days, 0 = keep
      # forever). The worker deletes only finished rows, in bounded batches.
      ATF_TASK_RETENTION_SECONDS: ${ATF_TASK_RETENTION_SECONDS:-2592000}
      ATF_DB_PATH: /app/data/atf.db
      ATF_LOGGER_ADDR: logger:50052
      # The ingest credential the logger's Log gate requires when it is armed.
      ATF_LOGGER_INGEST_TOKEN: ${ATF_LOGGER_INGEST_TOKEN:-}
      # Diagnostics, empty = off: ATF_RAW_API_TRACE dumps per-request MTProto
      # traffic, ATF_BUTTON_STYLES=0 disables styled keyboards and
      # ATF_BUTTON_STYLE_PROBE=<chat id> sends one styled message at boot so an
      # operator can confirm the live session accepts keyboardButtonStyle.
      ATF_RAW_API_TRACE: ${ATF_RAW_API_TRACE:-}
      ATF_BUTTON_STYLES: ${ATF_BUTTON_STYLES:-}
      ATF_BUTTON_STYLE_PROBE: ${ATF_BUTTON_STYLE_PROBE:-}
      # Worker coordination: which loop runs on which replica when the stack is
      # scaled out. Empty keeps the single-replica behaviour (nothing is
      # coordinated, nothing else changes).
      ATF_REDIS_ADDR: ${ATF_REDIS_ADDR:-redis:6379}
      ATF_REDIS_PASSWORD: ${ATF_REDIS_PASSWORD:-}
    volumes:
      - atf-data:/app/data
    networks:
      - atf-net
    # Core has no HTTP surface, so liveness is its gRPC listener. Probing it in
    # Python keeps the check inside the image (no curl/wget needed) and turns a
    # wedged process — which still counts as "running" to Docker — into an
    # unhealthy container that tools and operators can actually see.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1', int(os.environ.get('ATF_GRPC_PORT') or 50051))) == 0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Go execution engine (business execution plane). OFF by default:
  # ATF_WORKER_ENABLED must be set (AND ATF_CORE_RPC_TOKEN must be non-empty)
  # before this container consumes a single delivery job. Until then the
  # Python Core keeps its queue loop and this worker only reports health —
  # the strangler-fig guarantee that one, and only one, execution path runs.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: atf-worker
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      # The switch. Unset = the Python loop owns delivery execution.
      ATF_WORKER_ENABLED: ${ATF_WORKER_ENABLED:-0}
      # The shared internal RPC secret — the same value the Go API already
      # uses against the core. Empty + enabled = refuse to start, on purpose.
      ATF_CORE_RPC_TOKEN: ${ATF_CORE_RPC_TOKEN:-}
      # The SQLite store the Python Core writes — the SAME file both engines
      # share, mounted at the worker-owned path the image prepared, so the
      # non-root worker can actually write the claim updates. (Mounting the
      # shared atf-data volume at /app/data would work only for a user that
      # can write root-owned rows; the worker runs as `atf`.)
      ATF_DB_PATH: /var/lib/atf/data/atf.db
      # The Python Telegram Runtime's gRPC endpoint.
      ATF_TELEGRAM_RUNTIME_ADDR: ${ATF_TELEGRAM_RUNTIME_ADDR:-core:50053}
      # Queue knobs shared 1:1 with the Python worker's ATF_QUEUE_* names.
      ATF_QUEUE_NUM_WORKERS: ${ATF_QUEUE_NUM_WORKERS:-4}
      ATF_QUEUE_BATCH_SIZE: ${ATF_QUEUE_BATCH_SIZE:-5}
      ATF_QUEUE_LEASE_SECONDS: ${ATF_QUEUE_LEASE_SECONDS:-30}
      # Media scratch: a directory ONLY this container manages.
      ATF_MEDIA_DIR: /var/lib/atf/media
    volumes:
      # The shared delivery store: both engines read and write the same
      # atf.db, at a path the worker's image owns (see ATF_DB_PATH above).
      - atf-data:/var/lib/atf/data
      - atf-worker-media:/var/lib/atf/media
    networks:
      - atf-net
    # Deliberately NO ports: section. The health/metrics surface on 8090 is
    # internal-only — nothing outside the compose network needs it, and
    # publishing it would expose an authenticated internal RPC to the host.
    healthcheck:
      test: ["CMD", "atf-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atf-api
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - core
    environment:
      ATF_CORE_GRPC: core:50051
      # Same value as the core's ATF_CORE_RPC_TOKEN (see the core service above).
      ATF_CORE_RPC_TOKEN: ${ATF_CORE_RPC_TOKEN:-}
      ATF_LOGGER_GRPC: logger:50052
      # Read (queries/stats) and admin (purge) credentials for the logger —
      # distinct secrets, so a leaked API key can never write or erase.
      ATF_LOGGER_READ_TOKEN: ${ATF_LOGGER_READ_TOKEN:-}
      ATF_LOGGER_ADMIN_TOKEN: ${ATF_LOGGER_ADMIN_TOKEN:-}
      ATF_API_ADDR: ":8080"
      ATF_API_KEY: ${ATF_API_KEY:-}
      # The web gateway runs in its own container, so the health handler must
      # probe it over the compose network, not 127.0.0.1:8088 (nothing listens
      # there inside the api container, and /api/v1/health/services would
      # otherwise report the gateway as down).
      ATF_WEB_HEALTH_URL: http://web:8088/healthz
      # Rate limiting at this process's boundary (same store the Core
      # coordinates through). Effective only when the redis service is up;
      # remove the redis service and the classes fall back per their policy.
      ATF_REDIS_ADDR: ${ATF_REDIS_ADDR:-redis:6379}
      ATF_REDIS_PASSWORD: ${ATF_REDIS_PASSWORD:-}
      ATF_RATELIMIT_ALGO: ${ATF_RATELIMIT_ALGO:-tb}
    ports:
      - "8080:8080"
    networks:
      - atf-net
    # Without this the api had no health signal at all: a hung handler or a
    # dead gRPC client still showed as "Up". /healthz is the handler's own
    # readiness route and needs no extra tooling beyond the image's wget.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: atf-web
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ATF_WEB_ADDR: "0.0.0.0:8088"
      ATF_API_ADDR: "http://api:8080"
    ports:
      - "8088:8088"
    networks:
      - atf-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Optional TLS reverse proxy. Enable with --profile tls (see docs/tls.md):
  #   docker compose --profile tls up -d
  # Caddy provisions a Let's Encrypt certificate automatically for
  # ATF_TLS_DOMAIN and terminates TLS for the dashboard.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: atf-caddy
    # Rotation: see the x-logging anchor at the top of this file.
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - web
    environment:
      ATF_TLS_DOMAIN: ${ATF_TLS_DOMAIN:-localhost}
      ATF_TLS_EMAIL: ${ATF_TLS_EMAIL:-}
      ATF_WEB_INTERNAL_ADDR: http://web:8088
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - atf-net

volumes:
  atf-data:
  # Worker-owned media scratch: the Go Worker stages re-upload downloads here
  # and the Python Telegram Runtime writes into it over gRPC. One owner (the
  # worker), bounded by ATF_MEDIA_QUOTA_BYTES.
  atf-worker-media:
  logger-rust-data:
  caddy-data:
  caddy-config:

networks:
  atf-net:
    driver: bridge

# The self-hosted 9router AI gateway is an OPTIONAL sibling stack that owns its
# own bridge network. Attaching to it cannot live in this file: an
# `external: true` network makes `docker compose up` fail outright
# ("network 9router_default declared as external, but could not be found") on
# every host that does not run that stack — a fresh install, a CI smoke test, a
# fork. Bring it in explicitly when the AI gateway is present:
#
#   docker compose -f docker-compose.yml -f docker-compose.9router.yml up -d
#
# Without the overlay the stack is fully functional; only AI rewrite calls that
# address `http://9router:20128/v1` would fail to resolve.