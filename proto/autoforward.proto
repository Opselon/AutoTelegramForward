syntax = "proto3";

package autoforward;

option go_package = "autoforward/api/proto;autoforwardpb";

// -----------------------------------------------------------------------------
// Common Models
// -----------------------------------------------------------------------------

message StatusResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;
}

// -----------------------------------------------------------------------------
// Session Management
// -----------------------------------------------------------------------------

message SessionInfo {
  string id = 1;
  string phone_number = 2;
  string user_id = 3;
  string username = 4;
  string first_name = 5;
  bool is_active = 6;
  bool is_authorized = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  int64 owner_user_id = 10;   // telegram account owning this session (0 = legacy/unowned)
}

message ListSessionsRequest {
  int64 owner_user_id = 1;    // scope to one account (0 = all, admin/legacy)
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message StartLoginRequest {
  string phone_number = 1;
}

message StartLoginResponse {
  bool success = 1;
  string phone_code_hash = 2;
  string message = 3;
}

message SubmitCodeRequest {
  string phone_number = 1;
  string phone_code_hash = 2;
  string code = 3;
}

message SubmitCodeResponse {
  bool success = 1;
  bool requires_password = 2;
  string session_id = 3;
  string message = 4;
}

message SubmitPasswordRequest {
  string phone_number = 1;
  string phone_code_hash = 2;
  string password = 3;
}

message SubmitPasswordResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
}

message BackupSessionRequest {
  string session_id = 1;
  int64 owner_user_id = 2;   // v12.2: only the session's owner may export its string
}

message BackupSessionResponse {
  bool success = 1;
  string encrypted_session_data = 2;
  string checksum = 3;
  string message = 4;
}

message RestoreSessionRequest {
  string encrypted_session_data = 1;
  int64 owner_user_id = 2;
}

message RestoreSessionResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
}

message TerminateSessionRequest {
  string session_id = 1;
  int64 owner_user_id = 2;
}

// -----------------------------------------------------------------------------
// Forwarding Rules
// -----------------------------------------------------------------------------

enum RoutingType {
  ROUTING_UNKNOWN = 0;
  CHANNEL_TO_CHANNEL = 1;
  PV_TO_PV = 2;
  CHANNEL_TO_PV = 3;
  PV_TO_CHANNEL = 4;
}

enum ForwardMode {
  FORWARD_MODE_UNKNOWN = 0;
  DIRECT_FORWARD = 1; // Telegram native forward (keeps header)
  COPY_MESSAGE = 2;   // Clean copy without sender header
  CUSTOM_HEADER_COPY = 3; // Copy with admin-defined custom header
}

message ForwardRule {
  string id = 1;
  string session_id = 2;
  string source_chat_id = 3;
  string source_chat_name = 4;
  string target_chat_id = 5;
  string target_chat_name = 6;
  RoutingType routing_type = 7;
  ForwardMode forward_mode = 8;
  bool is_active = 9;
  string filter_rule_id = 10;
  string ai_config_id = 11;
  bool remove_links = 12;
  string custom_caption_template = 13;
  int64 created_at = 14;
  int64 updated_at = 15;

  // ---- Smart Forwarding Rules (v8) ----
  string name = 16;
  string description = 17;
  repeated string target_chat_ids = 18;
  string message_category = 19;   // ALL | VIP | REGULAR | CHANNEL_POST | USER_MESSAGE
  string intermediate_channel_id = 20;
  string intermediate_channel_name = 21;
  bool use_intermediate = 22;
  ForwardMode fallback_mode = 23; // MUST be COPY_MESSAGE or DROP, never native forward
  bool fallback_enabled = 24;
  string detection_criteria_json = 25;
  int32 priority = 26;
  int32 execution_order = 27;
  bool multi_route = 28;
  string media_handling = 29;     // AUTO | TEXT_ONLY | MEDIA_ONLY | TEXT_AND_MEDIA
  string dedupe_policy = 30;      // STRICT | RELAXED | DISABLED
  int32 max_retries = 31;
  double retry_backoff_base = 32;
  int32 rate_limit_per_minute = 33;
  int32 rate_limit_burst = 34;
  string custom_header = 35;
  string custom_footer = 36;
  bool header_enabled = 37;
  string template_text = 38;
  string template_media = 39;
  string template_album = 40;
  int32 caption_max_length = 41;
  bool preserve_signature = 42;
  bool is_paused = 43;
  int64 paused_until = 44;
  int32 version = 45;
  int64 owner_user_id = 46;   // owning telegram/web account (0 = legacy shared rule)
  // Bot-side UX toggles that live in the entity metadata dict (block_voice,
  // block_stickers, remove_emojis, sync_deletes, album_mode, ...). Round-tripped
  // as JSON so the web dashboard can read AND edit every bot feature.
  string custom_metadata_json = 47;
  // AI Rewrite (P2): policy on AI failure (SEND_ORIGINAL | DROP | RETRY |
  // QUARANTINE), pinned prompt version (0 = latest active), per-call AI timeout.
  // The effective prompt id rides inside custom_metadata_json as "prompt_id".
  string ai_fallback_policy = 48;
  int32 ai_prompt_version = 49;
  double ai_timeout_seconds = 50;
}

message CreateRuleRequest {
  ForwardRule rule = 1;
}

// ResolveChatRequest turns a human handle (username, t.me link or raw id) into
// the canonical numeric chat id that the dispatcher stores in forward rules.
message ResolveChatRequest {
  string session_id = 1;
  string handle = 2;  // @username, https://t.me/xxx, t.me/xxx or numeric id
  int64 owner_user_id = 3;  // v12.2: scope session choice to this account
}

message ResolveChatResponse {
  bool found = 1;
  string chat_id = 2;      // canonical numeric id (string-formatted)
  string title = 3;        // chat display name
  string username = 4;     // resolved @username (empty for private chats)
  string chat_type = 5;    // channel | supergroup | group | private | bot
  string error = 6;        // human-readable failure reason when not found
}

message UpdateRuleRequest {
  ForwardRule rule = 1;
}

message DeleteRuleRequest {
  string id = 1;
  int64 owner_user_id = 2;   // v12.2: tenant that owns the delete
}

message ListRulesRequest {
  string session_id = 1;
  int64 owner_user_id = 2;    // scope results to one account (0 = all, admins only)
}

// GetRule: single owner-scoped fetch. Cheaper than ListRules-then-filter
// for per-task actions (toggle/pause/edit) at scale — one indexed row
// instead of enumerating the owner's whole rule list.
message GetRuleRequest {
  string rule_id = 1;
  int64 owner_user_id = 2;    // mandatory: fail-closed when 0
}

message ListRulesResponse {
  repeated ForwardRule rules = 1;
}

// -----------------------------------------------------------------------------
// Filter Rules
// -----------------------------------------------------------------------------

message FilterRule {
  string id = 1;
  string name = 2;
  repeated string whitelist_keywords = 3;
  repeated string blacklist_keywords = 4;
  repeated string regex_patterns = 5;
  repeated string allowed_media_types = 6; // text, photo, video, document, voice, audio, animation
  repeated string blocked_media_types = 7;
  bool drop_service_messages = 8;
  int64 min_message_length = 9;
  int64 max_message_length = 10;
  int64 owner_user_id = 11;  // owning account (0 = legacy shared filter)
}

message CreateFilterRequest {
  FilterRule filter = 1;
}

message UpdateFilterRequest {
  FilterRule filter = 1;
}

message DeleteFilterRequest {
  string id = 1;
  int64 owner_user_id = 2;   // v12.2: tenant that owns the delete
}

message ListFiltersRequest {
  int64 owner_user_id = 1;  // scope to one account (0 = all, admins only)
}

message ListFiltersResponse {
  repeated FilterRule filters = 1;
}

// -----------------------------------------------------------------------------
// AI Rewrite Configuration
// -----------------------------------------------------------------------------

message AIConfig {
  string id = 1;
  string name = 2;
  string provider = 3;     // openai, anthropic, gemini, groq, deepseek, 9router, openrouter, custom
  string model = 4;        // gpt-4o-mini, claude-3-5-sonnet, gemini-2.0-flash, etc.
  string api_key = 5;      // Encrypted or masked
  string base_url = 6;     // Optional custom endpoint
  string system_prompt = 7;
  string user_prompt_template = 8; // e.g. "Rewrite this post in professional tone: {text}"
  double temperature = 9;
  bool is_enabled = 10;
  string target_language = 11; // en, fa, ru, zh, etc.
  int64 owner_user_id = 12;    // owning account (0 = legacy shared config)
}

message CreateAIConfigRequest {
  AIConfig config = 1;
}

message UpdateAIConfigRequest {
  AIConfig config = 1;
}

message DeleteAIConfigRequest {
  string id = 1;
  int64 owner_user_id = 2;   // v12.2: tenant that owns the delete
}

message ListAIConfigsRequest {
  int64 owner_user_id = 1;  // scope to one account (0 = all, admins only)
}

message ListAIConfigsResponse {
  repeated AIConfig configs = 1;
}

message TestAIRewriteRequest {
  string ai_config_id = 1;
  string sample_text = 2;
  int64 owner_user_id = 3;  // v12.2: refuse to bill another tenant's API key
}

message TestAIRewriteResponse {
  bool success = 1;
  string rewritten_text = 2;
  string error_message = 3;
}

// -----------------------------------------------------------------------------
// Prompt Templates (AI Rewrite prompt management — shared by bot & dashboard)
// -----------------------------------------------------------------------------

message PromptTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4;
  string user_prompt_template = 5;
  string target_language = 6;
  int32 current_version = 7;
  bool is_system = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string owner_user_id = 11;
}

message ListPromptTemplatesRequest {
  int64 owner_user_id = 1;   // v12: scope to one account (0 = system prompts only)
}

message ListPromptTemplatesResponse {
  repeated PromptTemplate templates = 1;
}

message SavePromptTemplateRequest {
  PromptTemplate template = 1;
  int32 expected_version = 2; // OCC guard; 0 = skip check
  int64 owner_user_id = 3;    // v12: tenant that owns the write
}

message DeletePromptTemplateRequest {
  string id = 1;
  int64 owner_user_id = 2;    // v12: tenant that owns the delete
}

message TestPromptRequest {
  string prompt_id = 1;
  string ai_config_id = 2;
  string sample_text = 3;
  int32 version = 4; // 0 = active version
  int64 owner_user_id = 5;  // v12.2: refuse to bill another tenant's AI config
}

message TestPromptResponse {
  bool success = 1;
  string transformed_text = 2;
  string error_message = 3;
  string error_code = 4;
  double execution_duration_ms = 5;
  string provider_used = 6;
  string model_used = 7;
  int32 prompt_version_used = 8;
  string circuit_state = 9;
}

// -----------------------------------------------------------------------------
// System Status & Statistics
// -----------------------------------------------------------------------------

message SystemStatsRequest {
  int64 owner_user_id = 1;
}

message SystemStatsResponse {
  bool core_running = 1;
  int64 uptime_seconds = 2;
  int32 active_sessions_count = 3;
  int32 active_rules_count = 4;
  int64 total_messages_processed = 5;
  int64 total_messages_forwarded = 6;
  int64 total_messages_filtered = 7;
  int64 total_messages_rewritten = 8;
  string bot_username = 9;
  string version = 10;
}

// -----------------------------------------------------------------------------
// Logging Service (debug log store)
// -----------------------------------------------------------------------------

message LogEntry {
  int64 ts = 1;
  string level = 2;    // DEBUG | INFO | WARN | ERROR
  string service = 3;  // core | api | logger | bot
  string category = 4; // login | forward | filter | ai | system | rule | session
  string message = 5;
  string detail = 6;   // JSON blob with structured context
}

message LogRequest {
  LogEntry entry = 1;
}

message QueryLogsRequest {
  string level = 1;
  string service = 2;
  string category = 3;
  string search = 4;
  int32 limit = 5;
  int64 since = 6;
}

message PurgeLogsRequest {
  // Optional filters. Empty = purge everything (with max_age_days as the only bound).
  string level = 1;
  string service = 2;
  string category = 3;
  // Keep the last N hours of history. 0 = no time-based protection.
  int64 older_than_hours = 4;
}

message PurgeLogsResponse {
  bool success = 1;
  int64 purged = 2;       // rows actually deleted
  int64 remaining = 3;    // rows left in the table
  string error = 4;
}

message QueryLogsResponse {
  repeated LogEntry logs = 1;
  int32 total = 2;
}

message LogStatsRequest {}

message LogStatsResponse {
  int64 total = 1;
  map<string, int32> by_level = 2;
  map<string, int32> by_category = 3;
}

// -----------------------------------------------------------------------------
// Smart Forwarding: rule preview / test, dead-letter queue, live delivery stats
// -----------------------------------------------------------------------------

message TestRuleRequest {
  string rule_id = 1;
  string sample_text = 2;
  string sample_chat_id = 3;
  string sample_sender_id = 4;
  string forward_origin_chat_id = 5;
  string forward_origin_username = 6;
  string forward_origin_title = 7;
  bool sample_has_media = 8;
  string sample_media_type = 9;   // text | photo | video | document | voice | audio | sticker | animation
  int64 owner_user_id = 10;  // v12.2: only the rule's owner may run a simulation
}

message TestRuleResponse {
  bool matched = 1;
  string match_reason = 2;
  string rule_name = 3;
  string message_category = 4;
  bool is_vip = 5;
  string vip_reason = 6;
  bool loop_detected = 7;
  string loop_reason = 8;
  string forward_mode = 9;
  string fallback_mode = 10;
  string rendered_text = 11;
  string rendered_header = 12;
  string rendered_footer = 13;
  repeated string delivery_targets = 14;
  string intermediate_channel_id = 15;
  bool use_intermediate = 16;
}

message ListDeadLetterRequest {
  string rule_id = 1;
  int32 limit = 2;
  int64 since = 3;
  int64 owner_user_id = 4; // v12: only entries from this tenant's rules
}

message DeadLetterEntry {
  string id = 1;
  string rule_id = 2;
  string source_chat_id = 3;
  int64 source_message_id = 4;
  string target_chat_id = 5;
  int32 attempts = 6;
  string last_error = 7;
  string error_category = 8;
  int64 dead_lettered_at = 9;
}

message ListDeadLetterResponse {
  repeated DeadLetterEntry entries = 1;
  int32 total = 2;
}

message ReplayDeadLetterRequest {
  string id = 1;
  int64 owner_user_id = 2; // v12: replay only if the entry's rule is owned
}

message PurgeDeadLetterRequest {
  string rule_id = 1;
  int64 older_than = 2;   // epoch seconds; 0 = all
  int64 owner_user_id = 3; // v12: purge only this tenant's rules
}

message DeliveryStatsRequest {
  int64 owner_user_id = 1; // v12: only stats for this tenant's rules
}

message DeliveryStatsResponse {
  int64 processed_total = 1;
  int64 forwarded_total = 2;
  int64 failed_total = 3;
  int64 dedup_skipped_total = 4;
  int64 filtered_total = 5;
  int64 in_queue = 6;
  int64 dead_lettered_total = 7;
  int64 retry_total = 8;
  repeated RuleLiveStat rules = 9;
  repeated RecentError errors = 10;
}

message RuleLiveStat {
  string rule_id = 1;
  string rule_name = 2;
  bool is_active = 3;
  bool is_paused = 4;
  int64 forwarded = 5;
  int64 filtered = 6;
  int64 errors = 7;
  int64 last_forward_ts = 8;
  string last_error = 9;
}

message RecentError {
  int64 ts = 1;
  string rule_id = 2;
  string category = 3;
  string error_name = 4;
  string severity = 5;
  string detail = 6;
  string chat_id = 7;
}

message PauseRuleRequest {
  string rule_id = 1;
  int64 until = 2;   // epoch seconds; 0 = indefinite
  int64 owner_user_id = 3;  // v12.2: tenant that owns the pause/resume
}

message RuleActionResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;
}

// -----------------------------------------------------------------------------
// gRPC Services Definition
// -----------------------------------------------------------------------------

service SessionControlService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  rpc SubmitCode(SubmitCodeRequest) returns (SubmitCodeResponse);
  rpc SubmitPassword(SubmitPasswordRequest) returns (SubmitPasswordResponse);
  rpc BackupSession(BackupSessionRequest) returns (BackupSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
  rpc TerminateSession(TerminateSessionRequest) returns (StatusResponse);
  rpc ResolveChat(ResolveChatRequest) returns (ResolveChatResponse);
}

service ForwardRuleControlService {
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc GetRule(GetRuleRequest) returns (ForwardRule);
  rpc CreateRule(CreateRuleRequest) returns (ForwardRule);
  rpc UpdateRule(UpdateRuleRequest) returns (ForwardRule);
  rpc DeleteRule(DeleteRuleRequest) returns (StatusResponse);
  rpc TestRule(TestRuleRequest) returns (TestRuleResponse);
  rpc PauseRule(PauseRuleRequest) returns (RuleActionResponse);
  rpc ResumeRule(PauseRuleRequest) returns (RuleActionResponse);
}

service DeliveryControlService {
  rpc GetDeliveryStats(DeliveryStatsRequest) returns (DeliveryStatsResponse);
  rpc ListDeadLetter(ListDeadLetterRequest) returns (ListDeadLetterResponse);
  rpc ReplayDeadLetter(ReplayDeadLetterRequest) returns (RuleActionResponse);
  rpc PurgeDeadLetter(PurgeDeadLetterRequest) returns (RuleActionResponse);
}

service FilterControlService {
  rpc ListFilters(ListFiltersRequest) returns (ListFiltersResponse);
  rpc CreateFilter(CreateFilterRequest) returns (FilterRule);
  rpc UpdateFilter(UpdateFilterRequest) returns (FilterRule);
  rpc DeleteFilter(DeleteFilterRequest) returns (StatusResponse);
}

service AIControlService {
  rpc ListAIConfigs(ListAIConfigsRequest) returns (ListAIConfigsResponse);
  rpc CreateAIConfig(CreateAIConfigRequest) returns (AIConfig);
  rpc UpdateAIConfig(UpdateAIConfigRequest) returns (AIConfig);
  rpc DeleteAIConfig(DeleteAIConfigRequest) returns (StatusResponse);
  rpc TestAIRewrite(TestAIRewriteRequest) returns (TestAIRewriteResponse);
  // Prompt template management (AI Rewrite prompts) — shared surface for the
  // Telegram bot and the web dashboard.
  rpc ListPromptTemplates(ListPromptTemplatesRequest) returns (ListPromptTemplatesResponse);
  rpc SavePromptTemplate(SavePromptTemplateRequest) returns (PromptTemplate);
  rpc DeletePromptTemplate(DeletePromptTemplateRequest) returns (StatusResponse);
  rpc TestPrompt(TestPromptRequest) returns (TestPromptResponse);
}

service SystemStatusControlService {
  rpc GetSystemStats(SystemStatsRequest) returns (SystemStatsResponse);
}

// -----------------------------------------------------------------------------
// Centralized audit events (Phase Three) — durable, tenant-scoped event store.
// Events are persisted by Core in PostgreSQL (audit_events table); queries are
// always scoped server-side to the authorized tenant.
// -----------------------------------------------------------------------------

message QueryAuditEventsRequest {
  string correlation_id = 1;
  string operation_id = 2;
  string feature_id = 3;
  string service = 4;
  string severity = 5;
  string event_category = 6;
  string outcome = 7;
  int64 since = 8;
  int64 until = 9;
  int32 limit = 10;
  int32 offset = 11;
  // Server-side tenant scope: resolved from the authenticated principal by the
  // Go API. A non-admin caller can never query another tenant's events.
  int64 owner_user_id = 12;
}

message AuditEventEntry {
  string event_id = 1;
  string schema_version = 2;
  string event_type = 3;
  string event_category = 4;
  string severity = 5;
  string outcome = 6;
  int64 ts_utc = 7;
  string service = 8;
  string correlation_id = 9;
  string operation_id = 10;
  string tenant_id = 11;
  string actor_type = 12;
  string actor_id = 13;
  string feature_id = 14;
  string action = 15;
  string resource_type = 16;
  string resource_id = 17;
  string rule_id = 18;
  string queue_job_id = 19;
  string reason_code = 20;
  int64 duration_ms = 21;
  string error_code = 22;
  string error_class = 23;
  bool retryable = 24;
  string result_summary = 25;
  string metadata_json = 26;
}

message QueryAuditEventsResponse {
  repeated AuditEventEntry events = 1;
  int32 total = 2;
}

service AuditControlService {
  rpc QueryAuditEvents(QueryAuditEventsRequest) returns (QueryAuditEventsResponse);
}

service LogControlService {
  rpc Log(LogRequest) returns (StatusResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc LogStats(LogStatsRequest) returns (LogStatsResponse);
  rpc PurgeLogs(PurgeLogsRequest) returns (PurgeLogsResponse);
}

// -----------------------------------------------------------------------------
// Backup & Restore — migrate a full installation (or one tenant) between
// servers. The snapshot is a JSON document containing LIVE CREDENTIALS, so
// the caller must protect it; `passphrase` encrypts the bundle with AES-GCM.
// -----------------------------------------------------------------------------

service BackupControlService {
  // owner_user_id = 0 means "everything" (single-box installs). Multi-tenant
  // boxes export one tenant per call.
  rpc BackupExport(BackupExportRequest) returns (BackupExportResponse);
  rpc BackupImport(BackupImportRequest) returns (BackupImportResponse);
}

message BackupExportRequest {
  int64 owner_user_id = 1;   // 0 = all tenants
  string passphrase = 2;     // optional AES-GCM encryption for the bundle
}

message BackupExportResponse {
  bool success = 1;
  string bundle = 2;         // JSON snapshot, optionally encrypted with enc:v1:
  map<string, int32> counts = 3;  // entity name -> count in the snapshot
  string error = 4;
}

message BackupImportRequest {
  string bundle = 1;                 // JSON snapshot (plain or enc:v1:)
  string passphrase = 2;             // required when the bundle is encrypted
  int64 target_owner_user_id = 3;    // 0 = keep the source owner
  bool overwrite_existing = 4;       // replace rows that already exist
}

message BackupImportResponse {
  bool success = 1;
  // entity name -> {imported, skipped, failed}
  map<string, EntityImportStats> stats = 2;
  string error = 3;
}

message EntityImportStats {
  int32 imported = 1;
  int32 skipped = 2;
  int32 failed = 3;
}

// -----------------------------------------------------------------------------
// Web Accounts — unified per-user identity for Telegram bot + Web dashboard.
// One account per Telegram user; the web dashboard authenticates with
// username/password and receives a JWT. All rules/sessions are owner-scoped.
// -----------------------------------------------------------------------------

message WebAccount {
  int64 user_id = 1;          // telegram user id (primary identity)
  string username = 2;
  string display_name = 3;
  bool is_admin = 4;
  string plan = 5;
  int64 created_at = 6;
}

message RegisterAccountRequest {
  int64 user_id = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  bool is_admin = 5;
}

message RegisterAccountResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;      // USERNAME_TAKEN | WEAK_PASSWORD | ...
  WebAccount account = 4;
}

message LoginAccountRequest {
  string username = 1;
  string password = 2;
  int64 telegram_user_id = 3; // optional link-proof when issued from the bot
}

message LoginAccountResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;      // INVALID_CREDENTIALS | ...
  string token = 4;           // JWT (HS256), 7-day expiry
  int64 expires_at = 5;       // unix seconds
  WebAccount account = 6;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
  bool is_admin = 4;
  string error = 5;
}

message IssueWebTokenRequest {
  int64 user_id = 1;          // bot -> core: mint a dashboard token for this user
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

service AccountControlService {
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc LoginAccount(LoginAccountRequest) returns (LoginAccountResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc IssueWebToken(IssueWebTokenRequest) returns (LoginAccountResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (StatusResponse);
  rpc GetAccount(GetAccountRequest) returns (WebAccount);
}

message GetAccountRequest {
  int64 user_id = 1;
  string username = 2;        // either user_id or username
}

// -----------------------------------------------------------------------------
// Admin & Client Control Plane
// -----------------------------------------------------------------------------

message AdminOverviewRequest {}
message AdminOverviewResponse {
  bool core_online = 1;
  int64 uptime_seconds = 2;
  int64 total_users = 3;
  int64 active_rules = 4;
  int64 queue_pending = 5;
  int64 recent_errors = 6;
  string system_status = 7;
}

message AdminUser {
  int64 user_id = 1;
  string username = 2;
  string plan = 3;
  string status = 4;
  bool is_admin = 5;
  int64 rules_count = 6;
  int64 created_at = 7;
}

message AdminListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message AdminListUsersResponse {
  repeated AdminUser users = 1;
  int64 total = 2;
}

message AdminSetUserStatusRequest {
  int64 user_id = 1;
  string status = 2;
}

message AdminBroadcastRequest {
  int64 initiator_user_id = 1;
  string message_text = 2;
  string target = 3;
}

message AdminBroadcastResponse {
  bool success = 1;
  string broadcast_id = 2;
  int64 total_recipients = 3;
  string message = 4;
}

message AdminGetSettingsRequest {}
message AdminSettingsResponse {
  bool force_sub_enabled = 1;
  string force_sub_channel = 2;
  string web_url = 3;
  bool registration_open = 4;
}

message AdminSaveSettingsRequest {
  bool force_sub_enabled = 1;
  string force_sub_channel = 2;
  string web_url = 3;
  bool registration_open = 4;
}

message AdminAdministrator {
  int64 user_id = 1;
  string role = 2;
  int64 added_by = 3;
  int64 created_at = 4;
}

message AdminListAdminsRequest {}
message AdminListAdminsResponse {
  repeated AdminAdministrator admins = 1;
}

message AdminAddAdminRequest {
  int64 user_id = 1;
  int64 added_by = 2;
}

message AdminRemoveAdminRequest {
  int64 user_id = 1;
  int64 removed_by = 2;
}

message ClientSettingsRequest {
  int64 user_id = 1;
}

message ClientSettingsResponse {
  int64 user_id = 1;
  string plan = 2;
  int64 quota_forwarded = 3;
  string language = 4;
  bool has_custom_credentials = 5;
  int64 api_id = 6;
  string api_hash_masked = 7;
}

message ClientSaveCredentialsRequest {
  int64 user_id = 1;
  int64 api_id = 2;
  string api_hash = 3;
}

service AdminControlService {
  rpc GetOverview(AdminOverviewRequest) returns (AdminOverviewResponse);
  rpc ListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc SetUserStatus(AdminSetUserStatusRequest) returns (StatusResponse);
  rpc Broadcast(AdminBroadcastRequest) returns (AdminBroadcastResponse);
  rpc GetSettings(AdminGetSettingsRequest) returns (AdminSettingsResponse);
  rpc SaveSettings(AdminSaveSettingsRequest) returns (StatusResponse);
  rpc ListAdmins(AdminListAdminsRequest) returns (AdminListAdminsResponse);
  rpc AddAdmin(AdminAddAdminRequest) returns (StatusResponse);
  rpc RemoveAdmin(AdminRemoveAdminRequest) returns (StatusResponse);
  rpc GetClientSettings(ClientSettingsRequest) returns (ClientSettingsResponse);
  rpc SaveClientCredentials(ClientSaveCredentialsRequest) returns (StatusResponse);
}
