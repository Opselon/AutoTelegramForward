# TEMPORARY — the clean-install gate, runnable before a tag.
#
# The real gate lives in release.yml and only runs on v* tags, which is
# how the v2.5.0 clean-install failed only after the tag was cut. This
# copy runs the identical job on PRs so a compose-level regression is
# caught before the tag. Delete it once the fix has shipped.
name: Clean-install smoke

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "Dockerfile.*"
      - ".env.example"
      - ".github/workflows/clean-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for smoke test
        shell: bash
        run: |
          cp .env.example .env
          echo "compose smoke test uses placeholder credentials from .env.example"
          # Those credentials cannot log in to Telegram. Without the core's
          # supported gRPC-only mode it exits on the failed bot login, restart-loops,
          # and any `docker compose exec` into it dies with 137 mid-check — which is
          # exactly how the v2.2.0 release failed this job.
          echo "ATF_DISABLE_BOT=1" >> .env
          grep -q '^ATF_DISABLE_BOT=1$' .env

      - name: Compose up
        shell: bash
        run: docker compose up -d --build

      - name: Poll health endpoints
        # Production release gate: every required internal service (core,
        # logger, API, web) must report online. Placeholder external Telegram
        # credentials are tolerated only if they do not degrade internal
        # service health; an HTTP response alone is not a healthy stack.
        shell: bash
        run: |
          for i in $(seq 1 30); do
            A=$(curl -sf http://127.0.0.1:8088/healthz || true)
            B=$(curl -sf http://127.0.0.1:8080/api/v1/health/services || true)
            if [ -n "$A" ] && [ -n "$B" ]; then
              echo "web /healthz: $A"
              echo "api /api/v1/health/services: $B"
              if echo "$B" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('services'); assert d.get('status') == 'healthy' and isinstance(s,list) and {x.get('name') for x in s if x.get('online') is True} >= {'core','logger','api','web'} and all(x.get('online') is True for x in s), d"; then
                echo "stack serves HTTP with a valid services payload"
                exit 0
              fi
            fi
            echo "waiting for stack... ($i/30)"
            sleep 10
          done
          echo "health endpoints never became ready"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Prove the logger is the Rust engine and it ingests end-to-end
        # A stack that answers /healthz is not enough: the logging service must
        # be the Rust engine (the Python daemon is gone) and a real gRPC write
        # must survive all the way to storage and back out of a query.
        shell: bash
        run: |
          docker compose exec -T logger sh -c 'command -v atf-logger && ! command -v python3'
          docker compose exec -T logger curl -fsS http://127.0.0.1:9109/healthz
          docker compose exec -T logger curl -fsS http://127.0.0.1:9109/readyz
          docker compose exec -T logger curl -fsS http://127.0.0.1:9109/metrics | grep -q '^atf_logger_events_'
          # 24 contract checks through Core's own stubs and producer class.
          docker compose exec -e ATF_LOGGER_ADDR=logger:50052 -T core python - \
            < scripts/acceptance/logger_acceptance.py

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::logs"
          docker compose logs --tail=200
          echo "::endgroup::"
          echo "::group::disk"
          df -h /
          docker system df
          echo "::endgroup::"

      - name: Compose down (always)
        if: always()
        shell: bash
        run: docker compose down -v
