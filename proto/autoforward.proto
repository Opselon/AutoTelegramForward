syntax = "proto3";

package autoforward;

option go_package = "autoforward/api/proto;autoforwardpb";

// -----------------------------------------------------------------------------
// Common Models
// -----------------------------------------------------------------------------

message StatusResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;
}

// -----------------------------------------------------------------------------
// Session Management
// -----------------------------------------------------------------------------

message SessionInfo {
  string id = 1;
  string phone_number = 2;
  string user_id = 3;
  string username = 4;
  string first_name = 5;
  bool is_active = 6;
  bool is_authorized = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  int64 owner_user_id = 10;   // telegram account owning this session (0 = legacy/unowned)
}

message ListSessionsRequest {
  int64 owner_user_id = 1;    // scope to one account (0 = all, admin/legacy)
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message StartLoginRequest {
  string phone_number = 1;
}

message StartLoginResponse {
  bool success = 1;
  string phone_code_hash = 2;
  string message = 3;
}

message SubmitCodeRequest {
  string phone_number = 1;
  string phone_code_hash = 2;
  string code = 3;
}

message SubmitCodeResponse {
  bool success = 1;
  bool requires_password = 2;
  string session_id = 3;
  string message = 4;
}

message SubmitPasswordRequest {
  string phone_number = 1;
  string phone_code_hash = 2;
  string password = 3;
}

message SubmitPasswordResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
}

message BackupSessionRequest {
  string session_id = 1;
}

message BackupSessionResponse {
  bool success = 1;
  string encrypted_session_data = 2;
  string checksum = 3;
  string message = 4;
}

message RestoreSessionRequest {
  string encrypted_session_data = 1;
  int64 owner_user_id = 2;
}

message RestoreSessionResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
}

message TerminateSessionRequest {
  string session_id = 1;
  int64 owner_user_id = 2;
}

// -----------------------------------------------------------------------------
// Forwarding Rules
// -----------------------------------------------------------------------------

enum RoutingType {
  ROUTING_UNKNOWN = 0;
  CHANNEL_TO_CHANNEL = 1;
  PV_TO_PV = 2;
  CHANNEL_TO_PV = 3;
  PV_TO_CHANNEL = 4;
}

enum ForwardMode {
  FORWARD_MODE_UNKNOWN = 0;
  DIRECT_FORWARD = 1; // Telegram native forward (keeps header)
  COPY_MESSAGE = 2;   // Clean copy without sender header
  CUSTOM_HEADER_COPY = 3; // Copy with admin-defined custom header
}

message ForwardRule {
  string id = 1;
  string session_id = 2;
  string source_chat_id = 3;
  string source_chat_name = 4;
  string target_chat_id = 5;
  string target_chat_name = 6;
  RoutingType routing_type = 7;
  ForwardMode forward_mode = 8;
  bool is_active = 9;
  string filter_rule_id = 10;
  string ai_config_id = 11;
  bool remove_links = 12;
  string custom_caption_template = 13;
  int64 created_at = 14;
  int64 updated_at = 15;

  // ---- Smart Forwarding Rules (v8) ----
  string name = 16;
  string description = 17;
  repeated string target_chat_ids = 18;
  string message_category = 19;   // ALL | VIP | REGULAR | CHANNEL_POST | USER_MESSAGE
  string intermediate_channel_id = 20;
  string intermediate_channel_name = 21;
  bool use_intermediate = 22;
  ForwardMode fallback_mode = 23; // MUST be COPY_MESSAGE or DROP, never native forward
  bool fallback_enabled = 24;
  string detection_criteria_json = 25;
  int32 priority = 26;
  int32 execution_order = 27;
  bool multi_route = 28;
  string media_handling = 29;     // AUTO | TEXT_ONLY | MEDIA_ONLY | TEXT_AND_MEDIA
  string dedupe_policy = 30;      // STRICT | RELAXED | DISABLED
  int32 max_retries = 31;
  double retry_backoff_base = 32;
  int32 rate_limit_per_minute = 33;
  int32 rate_limit_burst = 34;
  string custom_header = 35;
  string custom_footer = 36;
  bool header_enabled = 37;
  string template_text = 38;
  string template_media = 39;
  string template_album = 40;
  int32 caption_max_length = 41;
  bool preserve_signature = 42;
  bool is_paused = 43;
  int64 paused_until = 44;
  int32 version = 45;
  int64 owner_user_id = 46;   // owning telegram/web account (0 = legacy shared rule)
}

message CreateRuleRequest {
  ForwardRule rule = 1;
}

message UpdateRuleRequest {
  ForwardRule rule = 1;
}

message DeleteRuleRequest {
  string id = 1;
}

message ListRulesRequest {
  string session_id = 1;
  int64 owner_user_id = 2;    // scope results to one account (0 = all, admins only)
}

message ListRulesResponse {
  repeated ForwardRule rules = 1;
}

// -----------------------------------------------------------------------------
// Filter Rules
// -----------------------------------------------------------------------------

message FilterRule {
  string id = 1;
  string name = 2;
  repeated string whitelist_keywords = 3;
  repeated string blacklist_keywords = 4;
  repeated string regex_patterns = 5;
  repeated string allowed_media_types = 6; // text, photo, video, document, voice, audio, animation
  repeated string blocked_media_types = 7;
  bool drop_service_messages = 8;
  int64 min_message_length = 9;
  int64 max_message_length = 10;
}

message CreateFilterRequest {
  FilterRule filter = 1;
}

message UpdateFilterRequest {
  FilterRule filter = 1;
}

message DeleteFilterRequest {
  string id = 1;
}

message ListFiltersRequest {}

message ListFiltersResponse {
  repeated FilterRule filters = 1;
}

// -----------------------------------------------------------------------------
// AI Rewrite Configuration
// -----------------------------------------------------------------------------

message AIConfig {
  string id = 1;
  string name = 2;
  string provider = 3;     // openai, anthropic, gemini, groq, deepseek, 9router, openrouter, custom
  string model = 4;        // gpt-4o-mini, claude-3-5-sonnet, gemini-2.0-flash, etc.
  string api_key = 5;      // Encrypted or masked
  string base_url = 6;     // Optional custom endpoint
  string system_prompt = 7;
  string user_prompt_template = 8; // e.g. "Rewrite this post in professional tone: {text}"
  double temperature = 9;
  bool is_enabled = 10;
  string target_language = 11; // en, fa, ru, zh, etc.
}

message CreateAIConfigRequest {
  AIConfig config = 1;
}

message UpdateAIConfigRequest {
  AIConfig config = 1;
}

message DeleteAIConfigRequest {
  string id = 1;
}

message ListAIConfigsRequest {}

message ListAIConfigsResponse {
  repeated AIConfig configs = 1;
}

message TestAIRewriteRequest {
  string ai_config_id = 1;
  string sample_text = 2;
}

message TestAIRewriteResponse {
  bool success = 1;
  string rewritten_text = 2;
  string error_message = 3;
}

// -----------------------------------------------------------------------------
// System Status & Statistics
// -----------------------------------------------------------------------------

message SystemStatsRequest {
  int64 owner_user_id = 1;
}

message SystemStatsResponse {
  bool core_running = 1;
  int64 uptime_seconds = 2;
  int32 active_sessions_count = 3;
  int32 active_rules_count = 4;
  int64 total_messages_processed = 5;
  int64 total_messages_forwarded = 6;
  int64 total_messages_filtered = 7;
  int64 total_messages_rewritten = 8;
  string bot_username = 9;
  string version = 10;
}

// -----------------------------------------------------------------------------
// Logging Service (debug log store)
// -----------------------------------------------------------------------------

message LogEntry {
  int64 ts = 1;
  string level = 2;    // DEBUG | INFO | WARN | ERROR
  string service = 3;  // core | api | logger | bot
  string category = 4; // login | forward | filter | ai | system | rule | session
  string message = 5;
  string detail = 6;   // JSON blob with structured context
}

message LogRequest {
  LogEntry entry = 1;
}

message QueryLogsRequest {
  string level = 1;
  string service = 2;
  string category = 3;
  string search = 4;
  int32 limit = 5;
  int64 since = 6;
}

message QueryLogsResponse {
  repeated LogEntry logs = 1;
  int32 total = 2;
}

message LogStatsRequest {}

message LogStatsResponse {
  int64 total = 1;
  map<string, int32> by_level = 2;
  map<string, int32> by_category = 3;
}

// -----------------------------------------------------------------------------
// Smart Forwarding: rule preview / test, dead-letter queue, live delivery stats
// -----------------------------------------------------------------------------

message TestRuleRequest {
  string rule_id = 1;
  string sample_text = 2;
  string sample_chat_id = 3;
  string sample_sender_id = 4;
  string forward_origin_chat_id = 5;
  string forward_origin_username = 6;
  string forward_origin_title = 7;
  bool sample_has_media = 8;
  string sample_media_type = 9;   // text | photo | video | document | voice | audio | sticker | animation
}

message TestRuleResponse {
  bool matched = 1;
  string match_reason = 2;
  string rule_name = 3;
  string message_category = 4;
  bool is_vip = 5;
  string vip_reason = 6;
  bool loop_detected = 7;
  string loop_reason = 8;
  string forward_mode = 9;
  string fallback_mode = 10;
  string rendered_text = 11;
  string rendered_header = 12;
  string rendered_footer = 13;
  repeated string delivery_targets = 14;
  string intermediate_channel_id = 15;
  bool use_intermediate = 16;
}

message ListDeadLetterRequest {
  string rule_id = 1;
  int32 limit = 2;
  int64 since = 3;
}

message DeadLetterEntry {
  string id = 1;
  string rule_id = 2;
  string source_chat_id = 3;
  int64 source_message_id = 4;
  string target_chat_id = 5;
  int32 attempts = 6;
  string last_error = 7;
  string error_category = 8;
  int64 dead_lettered_at = 9;
}

message ListDeadLetterResponse {
  repeated DeadLetterEntry entries = 1;
  int32 total = 2;
}

message ReplayDeadLetterRequest {
  string id = 1;
}

message PurgeDeadLetterRequest {
  string rule_id = 1;
  int64 older_than = 2;   // epoch seconds; 0 = all
}

message DeliveryStatsRequest {}

message DeliveryStatsResponse {
  int64 processed_total = 1;
  int64 forwarded_total = 2;
  int64 failed_total = 3;
  int64 dedup_skipped_total = 4;
  int64 filtered_total = 5;
  int64 in_queue = 6;
  int64 dead_lettered_total = 7;
  int64 retry_total = 8;
  repeated RuleLiveStat rules = 9;
  repeated RecentError errors = 10;
}

message RuleLiveStat {
  string rule_id = 1;
  string rule_name = 2;
  bool is_active = 3;
  bool is_paused = 4;
  int64 forwarded = 5;
  int64 filtered = 6;
  int64 errors = 7;
  int64 last_forward_ts = 8;
  string last_error = 9;
}

message RecentError {
  int64 ts = 1;
  string rule_id = 2;
  string category = 3;
  string error_name = 4;
  string severity = 5;
  string detail = 6;
  string chat_id = 7;
}

message PauseRuleRequest {
  string rule_id = 1;
  int64 until = 2;   // epoch seconds; 0 = indefinite
}

message RuleActionResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;
}

// -----------------------------------------------------------------------------
// gRPC Services Definition
// -----------------------------------------------------------------------------

service SessionControlService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  rpc SubmitCode(SubmitCodeRequest) returns (SubmitCodeResponse);
  rpc SubmitPassword(SubmitPasswordRequest) returns (SubmitPasswordResponse);
  rpc BackupSession(BackupSessionRequest) returns (BackupSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
  rpc TerminateSession(TerminateSessionRequest) returns (StatusResponse);
}

service ForwardRuleControlService {
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc CreateRule(CreateRuleRequest) returns (ForwardRule);
  rpc UpdateRule(UpdateRuleRequest) returns (ForwardRule);
  rpc DeleteRule(DeleteRuleRequest) returns (StatusResponse);
  rpc TestRule(TestRuleRequest) returns (TestRuleResponse);
  rpc PauseRule(PauseRuleRequest) returns (RuleActionResponse);
  rpc ResumeRule(PauseRuleRequest) returns (RuleActionResponse);
}

service DeliveryControlService {
  rpc GetDeliveryStats(DeliveryStatsRequest) returns (DeliveryStatsResponse);
  rpc ListDeadLetter(ListDeadLetterRequest) returns (ListDeadLetterResponse);
  rpc ReplayDeadLetter(ReplayDeadLetterRequest) returns (RuleActionResponse);
  rpc PurgeDeadLetter(PurgeDeadLetterRequest) returns (RuleActionResponse);
}

service FilterControlService {
  rpc ListFilters(ListFiltersRequest) returns (ListFiltersResponse);
  rpc CreateFilter(CreateFilterRequest) returns (FilterRule);
  rpc UpdateFilter(UpdateFilterRequest) returns (FilterRule);
  rpc DeleteFilter(DeleteFilterRequest) returns (StatusResponse);
}

service AIControlService {
  rpc ListAIConfigs(ListAIConfigsRequest) returns (ListAIConfigsResponse);
  rpc CreateAIConfig(CreateAIConfigRequest) returns (AIConfig);
  rpc UpdateAIConfig(UpdateAIConfigRequest) returns (AIConfig);
  rpc DeleteAIConfig(DeleteAIConfigRequest) returns (StatusResponse);
  rpc TestAIRewrite(TestAIRewriteRequest) returns (TestAIRewriteResponse);
}

service SystemStatusControlService {
  rpc GetSystemStats(SystemStatsRequest) returns (SystemStatsResponse);
}

service LogControlService {
  rpc Log(LogRequest) returns (StatusResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc LogStats(LogStatsRequest) returns (LogStatsResponse);
}

// -----------------------------------------------------------------------------
// Web Accounts — unified per-user identity for Telegram bot + Web dashboard.
// One account per Telegram user; the web dashboard authenticates with
// username/password and receives a JWT. All rules/sessions are owner-scoped.
// -----------------------------------------------------------------------------

message WebAccount {
  int64 user_id = 1;          // telegram user id (primary identity)
  string username = 2;
  string display_name = 3;
  bool is_admin = 4;
  string plan = 5;
  int64 created_at = 6;
}

message RegisterAccountRequest {
  int64 user_id = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  bool is_admin = 5;
}

message RegisterAccountResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;      // USERNAME_TAKEN | WEAK_PASSWORD | ...
  WebAccount account = 4;
}

message LoginAccountRequest {
  string username = 1;
  string password = 2;
  int64 telegram_user_id = 3; // optional link-proof when issued from the bot
}

message LoginAccountResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;      // INVALID_CREDENTIALS | ...
  string token = 4;           // JWT (HS256), 7-day expiry
  int64 expires_at = 5;       // unix seconds
  WebAccount account = 6;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
  bool is_admin = 4;
  string error = 5;
}

message IssueWebTokenRequest {
  int64 user_id = 1;          // bot -> core: mint a dashboard token for this user
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

service AccountControlService {
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc LoginAccount(LoginAccountRequest) returns (LoginAccountResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc IssueWebToken(IssueWebTokenRequest) returns (LoginAccountResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (StatusResponse);
  rpc GetAccount(GetAccountRequest) returns (WebAccount);
}

message GetAccountRequest {
  int64 user_id = 1;
  string username = 2;        // either user_id or username
}
