name: cd

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. master or sha-xxxxxxx)"
        required: false
        default: "master"
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [master]

concurrency:
  group: cd-remote-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to remote server
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) &&
      secrets.SERVER_HOST != ''
    steps:
      - name: deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            export ATF_IMAGE_TAG="${INPUT_TAG:-master}"
            export ATF_BOT_TOKEN="${{ secrets.ATF_BOT_TOKEN }}"
            export ATF_API_ID="${{ secrets.ATF_API_ID }}"
            export ATF_API_HASH="${{ secrets.ATF_API_HASH }}"
            export ATF_MASTER_KEY="${{ secrets.ATF_MASTER_KEY }}"
            export ATF_API_KEY="${{ secrets.ATF_API_KEY }}"
            export ATF_WEB_URL="${{ secrets.ATF_WEB_URL }}"
            export ADMIN_USER_ID="${{ secrets.ADMIN_USER_ID }}"
            export ADMIN_IDS="${{ secrets.ADMIN_IDS }}"
            export ATF_JWT_SECRET="${{ secrets.ATF_JWT_SECRET }}"
            export ATF_REDIS_ADDR="${{ secrets.ATF_REDIS_ADDR }}"
            export ATF_REDIS_PASSWORD="${{ secrets.ATF_REDIS_PASSWORD }}"
            export ATF_CORE_RPC_TOKEN="${{ secrets.ATF_CORE_RPC_TOKEN }}"
            export ATF_RAW_API_TRACE="${{ secrets.ATF_RAW_API_TRACE }}"

            APP_DIR="${APP_DIR:-/root/AutoTelegramForward}"
            if [ -f "$APP_DIR/scripts/remote_deploy.sh" ]; then
              chmod +x "$APP_DIR/scripts/remote_deploy.sh"
              "$APP_DIR/scripts/remote_deploy.sh"
            else
              mkdir -p "$APP_DIR"
              curl -fsSL https://raw.githubusercontent.com/Opselon/AutoTelegramForward/master/scripts/remote_deploy.sh -o /tmp/remote_deploy.sh
              chmod +x /tmp/remote_deploy.sh
              /tmp/remote_deploy.sh
            fi
