<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b15" />
    <meta name="color-scheme" content="dark light" />
    <title>AutoTelegramForward PRO | Smart Gateway & Control Panel</title>
    <!-- The shell pins lang/dir/theme from stored preferences before the first
         paint (src/main.tsx). This element no longer claims Persian: that
         shipped an RTL document, and a Persian loading line, to every reader. -->
    <script>
      /* Pre-paint preferences: direction for Persian readers, surface for
         light-theme operators. Both are one-attribute writes; getting them in
         before the first stylesheet paints removes the flash entirely. */
      try {
        var stored = localStorage.getItem('atf_lang') || navigator.language || 'en'
        var code = String(stored).toLowerCase().split(/[-_]/)[0]
        var supported = ['en', 'fa', 'pt', 'uz', 'ru', 'id', 'es', 'fr', 'it', 'zh']
        if (supported.indexOf(code) === -1) code = 'en'
        document.documentElement.lang = code
        document.documentElement.dir = code === 'fa' ? 'rtl' : 'ltr'
        var theme = localStorage.getItem('atf_theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'light' ? '#f2f4f9' : '#070b15'
      } catch (e) {}
    </script>
    <!-- Non-blocking font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" />
    </noscript>
    <style>
      /* Zero-delay splash fallback while the bundle parses. Deliberately
         wordless: any loading sentence here is a hardcoded string the
         ten-locale catalog can never reach (pre-JS), so the brand mark and
         the spinner carry the splash on their own. */
      body {
        margin: 0;
        background-color: #070b15;
        color: #edf2fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme='light'] body {
        background-color: #f2f4f9;
        color: #172033;
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
        padding: 20px;
        text-align: center;
      }
      .app-initial-brand {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6e7bff 0%, #b26bff 100%);
        box-shadow: 0 4px 18px rgba(110, 123, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-initial-brand svg {
        width: 24px;
        height: 24px;
      }
      .app-initial-spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(110, 123, 255, 0.2);
        border-top-color: #6e7bff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>
        </div>
        <div class="app-initial-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
