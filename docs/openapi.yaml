openapi: 3.1.0
info:
  title: AutoTelegramForward API
  version: "1.0.0"
  description: |
    The Go API is the single authoritative entry point for every
    client-facing operation (web dashboard, Telegram bot surface, Telegram
    Mini App, Flutter mobile clients, CLI). Identity is verified once
    (Bearer JWT or a Telegram Mini App exchange) and every request is scoped to
    that verified tenant server-side -- client-supplied owner fields are
    ignored.

    `info.version` tracks the API contract version owned by the Go module
    (`APIVersion` in `api/internal/handlers/version.go`), NOT the product
    version; `GET /api/version` reports both. A test
    (`scripts/tests/test_openapi_route_parity.py`) fails the build when this
    file and `api/main.go` disagree about which routes exist or about which of
    them are public, user-scoped or administrator-only.

    Identity binding (per transport):
    - HTTP requests: `Authorization: Bearer <jwt>`, optional signed-session
      binding via `X-Session-Id` (the Go API verifies the signed session header
      before proxying the request to gRPC with the verified session attached).
    - Telegram: Mini App `initData` (signature-verified) exchanged at
      `/api/auth/tma` for the same JWT; the task lifecycle does NOT accept
      `owner_user_id` in any request body -- it is derived strictly from the
      verified identity at the gRPC boundary and echoed in the response
      envelope (`X-Request-Id` per middleware/correlation.go).

    Cross-cutting responses, returned by any authenticated route and therefore
    not repeated on every operation below:
    - `401` no verified identity (`{"error","error_code"}`);
    - `403` an authenticated caller refused by an authorization rule;
    - `413` `{"error","error_code":"body_too_large"}` -- a request body over the
      endpoint's cap (1 MiB for JSON, 64 MiB for `/api/backup/import`);
    - `429` the rate limiter refused (with `Retry-After`) or the limiter could
      not be evaluated on a fail-closed class (`rate_limit_unavailable`, 503);
    - `502` the core (or the logger) is not answering.

    The per-user task lifecycle gives every long-running user operation a
    durable, tenant-owned state machine in the authoritative database. States:
    `PENDING -> RUNNING -> SUCCEEDED | RETRY_WAIT -> PENDING (retry) | FAILED |
    CANCELLED`. Submitting the same `(owner, kind, idempotency_key)` returns the
    original task with `200` + `already_existed: true` instead of a duplicate.

servers:
  - url: /
    description: The deployment root. Every path below is absolute (the public prefix is `/api`).

tags:
  - name: system
    description: 'Probes, versions and the setup/environment contract. Public: these describe HOW to authenticate.'
  - name: auth
    description: 'Identity. A Telegram user id is public, so a session is only ever minted from a single-use login code or from verified Mini App `init_data`.'
  - name: rules
    description: 'Forwarding tasks ("rules") and their per-task settings. Tenant-scoped everywhere.'
  - name: sessions
    description: 'Telegram MTProto sessions owned by the caller.'
  - name: bot-tokens
    description: 'The bot credentials a task forwards *as*.'
  - name: ai
    description: 'Per-tenant AI configurations. The API key is write-only.'
  - name: filters
    description: 'Content filters applied on the caller''s own traffic.'
  - name: prompts
    description: 'AI rewrite prompt templates.'
  - name: tasks
    description: 'The per-user durable task lifecycle (`PENDING -> RUNNING -> RETRY_WAIT -> ... -> SUCCEEDED | FAILED | CANCELLED`).'
  - name: queue
    description: 'Delivery queue and dead-letter queue.'
  - name: simulator
    description: 'Pipeline dry-run.'
  - name: pv-responder
    description: 'Private-chat auto-responder.'
  - name: logs
    description: 'The task-scoped log archive and the collection policy.'
  - name: audit
    description: 'Centralized audit events.'
  - name: devops
    description: 'Diagnostics and whole-installation backup/restore.'
  - name: client
    description: 'Per-client settings and personal credentials.'
  - name: admin
    description: 'Administrator control plane. Strictly gated by a server-verified `ADMIN_IDS` membership.'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    taskId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized: { description: "No verified identity", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
    Forbidden: { description: "Authenticated but not entitled (e.g. an administrator-only control, or `rule_scope_required`)", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
    BadRequest: { description: "Refused: malformed body, unknown kind, invalid state transition", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
    NotFound: { description: "Not found. A resource belonging to another tenant is deliberately indistinguishable from a missing one.", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
    BodyTooLarge: { description: "`error_code: body_too_large`", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
    CoreUnavailable: { description: "A backend service (core or logger) is not answering", content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
  schemas:
    Refusal:
      type: object
      description: The one refusal shape every route uses, so a client renders it instead of printing an identifier it does not know.
      properties:
        error:
          type: string
          description: Human-readable reason.
        error_code:
          type: string
          description: Stable machine-readable reason (e.g. `not_found`, `rule_scope_required`, `body_too_large`).
        code:
          type: string
          description: Legacy alias of `error_code` kept for older clients.
    UserTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: integer, format: int64, description: "Owner resolved from the verified token; echoed for client-side checks" }
        kind:
          type: string
          enum: [session.backup, dlq.replay, dlq.purge, backup.export]
        status:
          type: string
          enum: [PENDING, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]
        idempotency_key: { type: string }
        attempt: { type: integer }
        max_attempts: { type: integer, maximum: 8 }
        payload_json: { type: object, description: "Bounded to 64 KiB server-side" }
        result_json: { type: object }
        error: { type: string }
        error_code: { type: string }
        created_at: { type: integer, description: "epoch seconds" }
        updated_at: { type: integer }
        started_at: { type: integer }
        finished_at: { type: integer }
    TaskEnvelope:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/UserTask' }
    CreateTaskReply:
      type: object
      properties:
        task: { $ref: '#/components/schemas/UserTask' }
        already_existed:
          type: boolean
          description: "true -> the idempotency key matched an existing task (HTTP 200); false -> created (HTTP 201)"
        id: { type: string }
        status: { type: string }
    TaskPage:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/UserTask' }
        total: { type: integer, description: "Total matching rows in the CALLER's scope" }
        limit: { type: integer, maximum: 200 }
        offset: { type: integer, minimum: 0 }

paths:
  /healthz:
    get:
      tags: [system]
      summary: 'Liveness probe (never gated by a dependency)'
      operationId: getHealthz
      security: []
      x-atf-authorization: public
      responses:
        "200": { description: OK }
  /health:
    get:
      tags: [system]
      summary: 'Liveness probe alias'
      operationId: getHealth
      security: []
      x-atf-authorization: public
      responses:
        "200": { description: OK }
  /readyz:
    get:
      tags: [system]
      summary: 'Readiness: answers 503 while a fail-closed dependency cannot enforce its promise'
      operationId: getReadyz
      security: []
      x-atf-authorization: public
      responses:
        "200": { description: OK }
  /ready:
    get:
      tags: [system]
      summary: 'Readiness probe alias'
      operationId: getReady
      security: []
      x-atf-authorization: public
      responses:
        "200": { description: OK }
  /api/version:
    get:
      tags: [system]
      summary: 'Product version, API version, minimum supported client and capability keys'
      operationId: getApiVersion
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/openapi.yaml:
    get:
      tags: [system]
      summary: 'This document'
      operationId: getApiOpenapi.Yaml
      security: []
      x-atf-authorization: public
      responses:
        "200": { description: "The document itself", content: { application/yaml: {} } }
  /api/health/services:
    get:
      tags: [system]
      summary: 'Health of every service in the chain (core, api, web, logger, redis)'
      operationId: getApiHealthServices
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/v1/health/services:
    get:
      tags: [system]
      summary: 'Health of every service in the chain (v1 alias)'
      operationId: getApiV1HealthServices
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/system/setup:
    get:
      tags: [system]
      summary: 'What this deployment is configured with (booleans only, never a secret value)'
      operationId: getApiSystemSetup
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/v1/system/setup:
    get:
      tags: [system]
      summary: 'Setup report (v1 alias)'
      operationId: getApiV1SystemSetup
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/system/env:
    get:
      tags: [system]
      summary: 'The environment contract the deployment is running under'
      operationId: getApiSystemEnv
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/v1/system/env:
    get:
      tags: [system]
      summary: 'Environment contract (v1 alias)'
      operationId: getApiV1SystemEnv
      security: []
      x-atf-authorization: public
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
  /api/auth/register:
    post:
      tags: [auth]
      summary: 'Create an account'
      operationId: postApiAuthRegister
      security: []
      x-atf-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/auth/login:
    post:
      tags: [auth]
      summary: 'Password login, answers a Bearer JWT'
      operationId: postApiAuthLogin
      security: []
      x-atf-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/auth/exchange-bot-token:
    post:
      tags: [auth]
      summary: 'Exchange a single-use login code for a session; posting a Telegram user id is refused'
      operationId: postApiAuthExchange-Bot-Token
      security: []
      x-atf-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/auth/tma:
    post:
      tags: [auth]
      summary: 'Exchange Telegram Mini App `init_data` (HMAC-SHA256 verified against the bot token) for the same JWT'
      operationId: postApiAuthTma
      security: []
      x-atf-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/auth/change-password:
    patch:
      tags: [auth]
      summary: 'Change the caller''s own password; the subject is the token''s user and a body `user_id` naming anybody else is 403'
      operationId: patchApiAuthChange-Password
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: 'The caller''s own verified identity'
      operationId: getApiAuthMe
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/auth/bot-login-link:
    get:
      tags: [auth]
      summary: 'Mint the caller''s own single-use dashboard login link (429 + Retry-After inside the 60 s cooldown)'
      operationId: getApiAuthBot-Login-Link
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/stats:
    get:
      tags: [rules]
      summary: 'The caller''s own counters (rules, sessions, queue depth)'
      operationId: getApiStats
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/rules:
    get:
      tags: [rules]
      summary: 'List the caller''s forwarding rules (tenant-scoped, bounded page)'
      operationId: getApiRules
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [rules]
      summary: 'Create a forwarding rule'
      operationId: postApiRules
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
  /api/rules/{id}:
    get:
      tags: [rules]
      summary: 'One rule the caller owns'
      operationId: getApiRulesId
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [rules]
      summary: 'Replace a rule the caller owns'
      operationId: putApiRulesId
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rules]
      summary: 'Partial update: the body carries only what changes and `update_mask` (body array or `?update_mask=a,b`) names it'
      operationId: patchApiRulesId
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [rules]
      summary: 'Delete a rule the caller owns'
      operationId: deleteApiRulesId
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/toggle:
    post:
      tags: [rules]
      summary: 'Enable or disable a rule'
      operationId: postApiRulesIdToggle
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/duplicate:
    post:
      tags: [rules]
      summary: 'Duplicate a rule into a new one'
      operationId: postApiRulesIdDuplicate
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/stop:
    post:
      tags: [rules]
      summary: 'Stop a rule'
      operationId: postApiRulesIdStop
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/restart:
    post:
      tags: [rules]
      summary: 'Restart a stopped rule'
      operationId: postApiRulesIdRestart
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/pause:
    post:
      tags: [rules]
      summary: 'Pause a rule until `until` (epoch seconds); the body is optional'
      operationId: postApiRulesIdPause
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/resume:
    post:
      tags: [rules]
      summary: 'Resume a paused rule'
      operationId: postApiRulesIdResume
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/route-path:
    post:
      tags: [rules]
      summary: 'Quick-set the source and target path of a rule'
      operationId: postApiRulesIdRoute-Path
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/rules/settings/schema:
    get:
      tags: [rules]
      summary: 'The per-task settings schema (needs no rule, so an editor can be built before the user owns anything)'
      operationId: getApiRulesSettingsSchema
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /api/rules/{id}/settings:
    get:
      tags: [rules]
      summary: 'The full per-task settings surface the Telegram bot edits'
      operationId: getApiRulesIdSettings
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [rules]
      summary: 'Replace a task''s settings'
      operationId: putApiRulesIdSettings
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rules]
      summary: 'Partial settings update (`update_mask`, plus `edited`/`resets` hints)'
      operationId: patchApiRulesIdSettings
      security: [{ bearerAuth: [] }]
      x-atf-authorization: user
      parameters: [{ $ref: '#/components/parameters/taskId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "400": { $ref: '#/components/responses/BadRequest' }
