[package]
name = "atf-logger"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "Bounded, batched gRPC log ingest/storage/query engine for AutoTelegramForward (LogControlService)"
license = "MIT"

[lib]
name = "atf_logger"
path = "src/lib.rs"

[[bin]]
name = "atf-logger"
path = "src/main.rs"

[dependencies]
# Async runtime and everything the transport needs (rt-multi-thread, signal,
# time, net for the metrics listener, sync for the ack oneshot channels).
tokio = { version = "1.42", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
    "io-util",
] }
# gRPC server: the only thing that can speak the shared LogControlService wire
# contract (HTTP/2 + protobuf framing) to the existing Python/Go clients.
tonic = { version = "0.12", features = ["transport"] }
# Protobuf message types generated by build.rs from proto/logger.proto.
prost = "0.13"
# SQLite: owner of the archive, and the compatibility contract with the Python
# LoggerDatabase. "bundled" compiles SQLite from source so the runtime image
# needs no libsqlite3 and the version is pinned by the lockfile.
rusqlite = { version = "0.32", features = ["bundled"] }
# Config parsing (optional TOML-free), structured detail handling.
serde = { version = "1", features = ["derive"] }
# preserve_order: field-aware redaction must not silently reorder detail keys
# when it rewrites a JSON blob.
serde_json = { version = "1", features = ["preserve_order"] }
# Redaction parity with logger/redaction.py (the Python module is regex-based).
regex = "1"
# PostgreSQL: the second first-class backend (docs/logging-contract.md §4). The
# handshake needs a wire-protocol driver; there is no way to speak it with the
# existing set. Synchronous Client wrapper over tokio-postgres, no TLS feature
# (documented limitation in README.md).
postgres = { version = "0.19", default-features = false }
# TcpListenerStream, so tonic can serve an already-bound listener. That is what
# lets the binary learn the real port when --listen uses port 0, which the
# benchmark harness depends on. Already in tonic's dependency tree.
tokio-stream = "0.1"
# Structured service diagnostics, always written to stderr so stdout stays
# reserved for the benchmark's "listening on <addr>" handshake line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Integration tests drive the real binary and a real gRPC client in-process.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
