services:
  logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    container_name: atf-logger
    restart: unless-stopped
    environment:
      ATF_LOGGER_PORT: 50052
      ATF_LOGGER_DB_PATH: /app/data/logger.db
    volumes:
      - atf-data:/app/data
    networks:
      - atf-net

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: atf-core
    restart: unless-stopped
    depends_on:
      - logger
    environment:
      ATF_API_ID: ${ATF_API_ID}
      ATF_API_HASH: ${ATF_API_HASH}
      ATF_BOT_TOKEN: ${ATF_BOT_TOKEN}
      ATF_MASTER_KEY: ${ATF_MASTER_KEY}
      ATF_GRPC_PORT: 50051
      ATF_DB_PATH: /app/data/atf.db
      ATF_LOGGER_ADDR: logger:50052
    volumes:
      - atf-data:/app/data
    networks:
      - atf-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atf-api
    restart: unless-stopped
    depends_on:
      - core
    environment:
      ATF_CORE_GRPC: core:50051
      ATF_LOGGER_GRPC: logger:50052
      ATF_API_ADDR: ":8080"
      ATF_API_KEY: ${ATF_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - atf-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: atf-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ATF_WEB_ADDR: "0.0.0.0:8088"
      ATF_API_ADDR: "http://api:8080"
    ports:
      - "8088:8088"
    networks:
      - atf-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  atf-data:

networks:
  atf-net:
    driver: bridge
