name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The lease coordination (core/infrastructure/redis) is tested against a
      # real server, not a mock: its whole contract is TTL expiry and
      # token-checked scripts, which is exactly the part a mock would fake.
      redis:
        image: redis:7.4.11-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements.txt pins every version. Installing from it — not from
        # unpinned names — keeps CI testing the same dependency set that runs
        # in production, and stops an upstream release from silently breaking
        # CI (or fixing it locally while CI fails).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        # Fail-closed gate on defects, not style (see ruff.toml): undefined names,
        # dead redefinitions, duplicate dict keys, and blocking I/O inside async
        # handlers. Pinned so an upstream ruff release cannot turn a green PR red;
        # bump it deliberately, with the new findings fixed in the same PR.
        run: |
          pip install ruff==0.17.1
          ruff check core scripts atfcli

      - name: Run Python tests
        # ATF_TEST_REDIS_ADDR arms the real-Redis suites (lease coordination
        # and the API's limiter when its Go numbers carry over). Suites without
        # the variable skip, so a fork running this job without the service
        # still goes green on everything else.
        env:
          ATF_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: python -m pytest -q core/tests scripts/tests

      - name: Telegram UI hardcoded-string guard
        # New visible strings in Telegram UI handlers, callbacks, and button
        # labels must use the user's locale catalog. Existing debt is tracked
        # separately; this guard is change-scoped and fail-closed.
        run: python scripts/audit_telegram_i18n.py

      - name: Mobile UI hardcoded-copy guard
        # The two guards above cover the bot. The Flutter client had ~40 widget
        # labels ('Retry', 'Task Name', 'HEADER EMPTY') that never reached
        # mobile/lib/l10n/, so those screens rendered English in all 10 locales.
        # Stdlib-only on purpose: this job has no Dart SDK — flutter analyze
        # would not catch a hardcoded string anyway. Today's debt is pinned per
        # content (not per line) in scripts/.mobile_ui_copy_baseline.txt; the
        # gate is fail-closed on anything new, and prints a "backlog shrank"
        # notice when the baseline may be regenerated.
        run: python scripts/audit_mobile_ui_copy.py

      - name: Cross-language catalog audit
        # Every translation catalog (bot + mobile) must be 1:1 with the
        # English reference: no missing/extra keys, no empty values, no
        # Persian text stored under English keys (which rendered Persian
        # to English users in production, October 2026).
        run: python scripts/audit_cross_language.py

      - name: API contract audit
        # The web dashboard, the mobile app and the Go handler must agree on
        # every field of the system payloads. A renamed field compiles on both
        # sides and simply renders blank, so the shared fixtures in
        # contracts/fixtures/ are the reference for all three.
        run: python scripts/audit_api_contract.py

      - name: OpenAPI route parity
        # docs/openapi.yaml is what every external client generates from, so it
        # has to be the whole truth: every route api/main.go registers, nothing
        # it does not, the same authorization class the router enforces, and an
        # info.version equal to the module's APIVersion. It had drifted to
        # 14 of 98 routes at version 2.3.0 while the module exported 1.0.0.
        run: python -m pytest -q scripts/tests/test_openapi_route_parity.py

  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real Redis for the limiter's Lua semantics (scripts, TTLs, the atomic
      # counters a mock cannot reproduce). The miniredis suite runs regardless.
      redis:
        image: redis:7.4.11-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Build
        working-directory: api
        run: go build ./...

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Test
        working-directory: api
        env:
          ATF_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          # The whole tree, then the whole tree again under the race detector.
          # The detector used to run on the limiter alone, on the reasoning that
          # it was "the only Go code with shared state" — but the handlers hold
          # cross-request state too (the per-route limiter cache, the readiness
          # snapshot) and every handler now runs through a shared body-reading
          # path, so the narrow run could not observe a race in any of it.
          go test ./... -timeout 300s
          go test -race ./... -timeout 600s

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-tests, go-tests]
    steps:
      - uses: actions/checkout@v4
      # Every image used to be rebuilt from scratch on every PR with plain
      # `docker build` — no buildx, no layer cache, no proof that a cache exists.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core image
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: Dockerfile.core
          tags: atf-core
          load: true
          push: false
          cache-from: type=gha,scope=ci-core
          cache-to: type=gha,mode=max,scope=ci-core
      - name: Build api image
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: Dockerfile.api
          tags: atf-api
          load: true
          push: false
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Build logger image
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: .
          file: Dockerfile.logger-rust
          tags: atf-logger
          load: true
          push: false
          cache-from: type=gha,scope=ci-logger
          cache-to: type=gha,mode=max,scope=ci-logger
      - name: Build web image
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: .
          file: Dockerfile.web
          tags: atf-web
          load: true
          push: false
          cache-from: type=gha,scope=ci-web
          # also prime a local cache dir so the next step can prove a hit without
          # depending on the Actions cache token being exported to a run step
          cache-to: |
            type=gha,mode=max,scope=ci-web
            type=local,dest=/tmp/atf-layer-cache,mode=max
      # The web image is the one that burned 5h22m under QEMU: assert its layers
      # are really cached, i.e. a second build re-runs no dependency work at all.
      - name: Prove the web layer cache is a hit
        run: |
          set -o pipefail
          docker buildx build --progress=plain --file Dockerfile.web             --cache-from type=local,src=/tmp/atf-layer-cache             --output type=cacheonly . 2>&1 | tee /tmp/cache-proof.log
          if ! grep -q "CACHED" /tmp/cache-proof.log; then
            echo "::error::no layer came from cache — the build is not cacheable"
            exit 1
          fi
          for marker in "added 1" "Compiling " "Successfully installed" "go: downloading" "npm warn"; do
            if grep -q "$marker" /tmp/cache-proof.log; then
              echo "::error::dependency work re-ran despite the cache: $marker"
              exit 1
            fi
          done
          echo "cache hit: no dependency work re-ran"

  web-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Typecheck
        # The build alone is not enough: vite transpiles without checking, so a
        # field renamed in types.ts would ship and only fail at runtime.
        #
        # Run the projects explicitly: the root tsconfig.json is a solution-style
        # config (`"files": []` + only `references`), so a bare `npx tsc
        # --noEmit` resolves nothing and type-checks zero files — it exits 0 no
        # matter what the sources say.
        working-directory: web/frontend
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: UI-copy gate (JSX-aware)
        # Typechecking cannot see whether a label ever reaches a catalog: the
        # dashboard shipped 458 inline `isRtl ? '…' : '…'` branches and hundreds
        # of <span>Save changes</span> literals, so 9 of the 10 locales rendered
        # English. This gate parses the JSX with the bundled typescript compiler
        # and fails on any user-visible copy that is not a catalog lookup or a
        # documented technical token. Existing debt is pinned per content (not
        # per line) in scripts/.web_ui_copy_baseline.txt. Run from the repo root.
        run: node scripts/audit_web_ui_copy.js

      - name: Provenance rules
        # Verify how a settings row decides what to show (edit/own/inherited)
        # by running that logic directly, like the Go and Python suites do.
        # No framework here: the module is compiled standalone and loaded by node.
        working-directory: web/frontend
        run: |
          node node_modules/typescript/bin/tsc src/settingProvenance.ts \
            --ignoreConfig --outDir .provenance-build \
            --module esnext --target es2022 --moduleResolution bundler --skipLibCheck
          node tests/settingProvenance.test.mjs

      - name: Action result rules
        # A refusal must not read as a success. The API used to omit `success`
        # on a refused replay, and `success === false` never fired. The same
        # layer decides how a refused provider-key check is explained.
        working-directory: web/frontend
        run: |
          node node_modules/typescript/bin/tsc src/actionResult.ts src/providerKey.ts \
            --ignoreConfig --outDir .actions-build \
            --module esnext --target es2022 --moduleResolution bundler --skipLibCheck
          node tests/actionResult.test.mjs
          # A key check that cannot name its refusal leaves the tenant with a
          # spinner and no reason to change anything.
          node tests/providerKey.test.mjs

      - name: Session identity rules
        # Which tab is looking at whose data: a second tab logging in or out must
        # not leave this dashboard on screen, and a different account must
        # remount the tree instead of reusing the previous account's state.
        working-directory: web/frontend
        run: |
          node node_modules/typescript/bin/tsc src/sessionIdentity.ts \
            --ignoreConfig --outDir .identity-build \
            --module esnext --target es2022 --moduleResolution bundler --skipLibCheck
          node tests/sessionIdentity.test.mjs

      - name: Build
        working-directory: web/frontend
        run: npm run build

  website:
    # The product site in website/ is a deliverable (it is published to GitHub
    # Pages), but nothing tested it in CI: a broken link, a duplicate element id
    # or a colour utility with no light-theme counterpart only surfaced after
    # deploy. This job runs the same suite the maintainers run locally.
    #
    # astro.config.mjs makes `CI=true` default the base path to
    # /AutoTelegramForward, the prefix the site is deployed under. The whole
    # suite (Playwright's webServer, the contrast report's route enumeration,
    # the SEO audit's absolute paths) is written against the site root, so the
    # root build must be pinned explicitly — an empty BASE_PATH falls through
    # to the CI default, which is exactly the silent mismatch that made the
    # preview server appear dead here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        # The Astro 7 / Tailwind 3 toolchain carries peer ranges npm 10 refuses
        # outright; --legacy-peer-deps makes the install match the lockfile.
        working-directory: website
        run: npm ci --legacy-peer-deps

      - name: Build (site root)
        working-directory: website
        run: npm run build

      - name: SEO, links and metadata
        working-directory: website
        run: npm run test:seo

      - name: Theme parity
        working-directory: website
        run: npm run test:theme

      - name: API reference coverage
        # The endpoint explorer is generated by joining the route table parsed
        # from api/main.go with the prose in src/data/api-surface.ts. This gate
        # fails when a registered route has no entry (it would ship undocumented)
        # or an entry has no route (the page would promise an endpoint the
        # binary does not answer on).
        working-directory: website
        run: npm run test:api

      - name: System atlas
        working-directory: website
        run: npm run test:system

      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: End-to-end, accessibility and premium-surface tests
        working-directory: website
        run: npx playwright test

      - name: WCAG AA contrast report (both themes, every page)
        working-directory: website
        run: |
          # Playwright has stopped its own preview server by the time this runs,
          # but it leaves a lock file behind, so this instance opts out of the
          # lock (`--ignore-lock`) and uses its own port; the report is pointed
          # at that port explicitly instead of assuming 4321.
          npx astro preview --port 4322 --ignore-lock &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4322/ && break
            sleep 1
          done
          PREVIEW_URL=http://localhost:4322 node tests/contrast-report.mjs

      - name: Production base path (canonical, sitemap, links)
        # Finally rebuild the way GitHub Pages serves it and re-run the audit
        # that knows about the /AutoTelegramForward prefix on every canonical.
        working-directory: website
        run: |
          SITE_URL="https://opselon.github.io" BASE_PATH="/AutoTelegramForward" npm run build
          npm run test:seo | tee /tmp/seo-basepath.log
          npm run test:api | tee /tmp/api-basepath.log
          grep -q "canonical base-prefix assertion skipped" /tmp/seo-basepath.log && exit 1 || exit 0

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Check formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Compile Android Gradle target
        working-directory: mobile
        run: flutter build apk --debug

# Rust Logger engine gate. Deliberately SEPARATE from the existing CodeQL
# rust job, which runs with build-mode: none and therefore never compiles
# anything -- a crate whose tests all fail would sail through it.
  rust-logger:
    name: Rust Logger (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`: this job denies warnings, so a toolchain bump would
      # otherwise be able to block unrelated PRs. 1.90.0 is what Cargo.toml
      # declares as `rust-version` and what the image builds with.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/logger
      # build.rs generates the gRPC code with prost, which shells out to protoc.
      # The runner image does not ship it (the Dockerfile installs it for the
      # image build, but clippy and the tests compile the crate here).
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version
      - name: Formatting
        working-directory: rust/logger
        run: cargo fmt --all --check
      - name: Lint (deny warnings)
        working-directory: rust/logger
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Security-sensitive tests (redaction + ack paths)
        working-directory: rust/logger
        run: "cargo test --lib redaction:: -- --nocapture"
      - name: Unit tests
        working-directory: rust/logger
        run: cargo test --lib
      - name: Integration tests (gRPC over real TCP + real SQLite)
        working-directory: rust/logger
        run: cargo test --test grpc_end_to_end --test binary_end_to_end
      # The packaging image is a deliverable, so a Dockerfile that no longer
      # builds has to fail here rather than at deploy time.
      - name: Build the logger image
        run: docker build -f Dockerfile.logger-rust -t atf-logger-rust:ci .
# Live PostgreSQL (tests/postgres_end_to_end.rs) is env-gated on
# ATF_LOGGER_TEST_PG_DSN; add a postgres:16-alpine service container and set
# that env var to make it a required gate once the adapter is verified.
