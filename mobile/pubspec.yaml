name: autoforward_mobile
description: "AutoTelegramForward — production mobile client for the AutoTelegramForward forwarding engine."
publish_to: "none"
version: 2.2.2+6
environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.3.0
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/cfg/env.json
