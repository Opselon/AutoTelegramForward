# AutoTelegramForward — cross-platform release pipeline.
#
# Produces, for every tag (v*) and every manual dispatch:
#   * self-contained single-file `atf` binaries — the ONE entry point that
#     manages every service (core + logger + api) — for
#     Linux / macOS / Windows on x86_64 + arm64
#   * the Go REST API as a static binary for the same matrix
#   * a multi-arch (amd64 + arm64) Docker image per service
#   * a portable source tarball (no toolchain needed to *download* it)
#   * SHA256SUMS.txt covering every artifact + a GitHub Release
#
# Single source of truth for the version number: the VERSION file at the
# repo root (also read by core/config.py and atf.py at runtime).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_tag:
        description: "Create a tag from this commit and release it"
        required: false
        default: "true"

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.27"

jobs:
  # ------------------------------------------------------------------------ #
  # Resolve the version once; every artifact inherits it.
  # ------------------------------------------------------------------------ #
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "${VERSION}" ]; then
            echo "VERSION file is empty"; exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "${TAG#v}" != "${VERSION}" ]; then
              echo "Tag ${TAG} does not match VERSION ${VERSION}"; exit 1
            fi
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  # ------------------------------------------------------------------------ #
  # Single-file binaries. PyInstaller freezes the whole app + interpreter into
  # one executable; the CLI supervises every microservice from inside it.
  # ------------------------------------------------------------------------ #
  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,   suffix: linux-x64,    label: Linux x86_64}
          - {os: ubuntu-24.04-arm, suffix: linux-arm64, label: Linux arm64}
          # NOTE: macOS PyInstaller bundles must build natively (no
          # cross-compilation possible). Both entries intentionally stay on
          # macos-latest; do NOT move them to ubuntu runners. If GitHub
          # cancels a mac jobs for capacity ("not acquired by Runner"),
          # re-run the failed jobs instead of weakening publish below.
          - {os: macos-latest,    suffix: macos-x64,    label: macOS Intel}
          - {os: macos-latest,    suffix: macos-arm64,  label: macOS Apple Silicon}
          - {os: windows-latest,  suffix: windows-x64,  label: Windows x64}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev libssl-dev patchelf

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi openssl || true

      - name: Build Go REST API
        shell: bash
        run: |
          mkdir -p bin
          cd api
          go build -trimpath -ldflags "-s -w" -o "../bin/atf-api${{ runner.os == 'Windows' && '.exe' || '' }}" .
          cd ..
          ls -la bin/

      - name: Build React Web Frontend
        shell: bash
        run: |
          cd web/frontend
          npm ci || npm install
          npm run build
          cd ../..

      - name: Build Rust Web Gateway
        shell: bash
        run: |
          cd web/backend
          cargo build --release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/atf-web-backend.exe ../../bin/atf-web-backend.exe
          else
            cp target/release/atf-web-backend ../../bin/atf-web-backend
          fi
          cd ../..
          ls -la bin/

      - name: Install PyInstaller + requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Ensure protobuf python stubs exist
        run: |
          if [ ! -f core/proto/autoforward_pb2.py ]; then
            python -m pip install --quiet grpcio-tools
            python scripts/gen_proto.py || true
          fi
        shell: bash

      - name: Stamp version into the bundle
        shell: bash
        run: |
          mkdir -p assets
          cp VERSION assets/VERSION

      - name: Freeze single-file CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --name "atf" \
            --add-data "VERSION:." \
            --add-data "core/proto:core/proto" \
            --add-data "logger:logger" \
            --add-data "proto:proto" \
            --add-data "config.example.yaml:." \
            --add-binary "bin/atf-api:." \
            --add-binary "bin/atf-web-backend:." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          chmod +x dist/atf
          ./dist/atf version
          cp dist/atf "assets/atf-${{ matrix.suffix }}"

      - name: Freeze single-file CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name "atf" \
            --add-data "VERSION;." \
            --add-data "core/proto;core/proto" \
            --add-data "logger;logger" \
            --add-data "proto;proto" \
            --add-data "config.example.yaml;." \
            --add-binary "bin/atf-api.exe;." \
            --add-binary "bin/atf-web-backend.exe;." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          ./dist/atf.exe version
          cp dist/atf.exe "assets/atf-${{ matrix.suffix }}.exe"

      - name: Freeze one-dir bundle (POSIX)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --name "atf" \
            --add-data "VERSION:." \
            --add-data "core/proto:core/proto" \
            --add-data "logger:logger" \
            --add-data "proto:proto" \
            --add-data "config.example.yaml:." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          tar -czf "assets/atf-${{ matrix.suffix }}-portable.tar.gz" -C dist atf

      - name: Freeze one-dir bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --name "atf" `
            --add-data "VERSION;." `
            --add-data "core/proto;core/proto" `
            --add-data "logger;logger" `
            --add-data "proto;proto" `
            --add-data "config.example.yaml;." `
            --hidden-import "pyrogram" `
            --hidden-import "pyrogram.session" `
            --hidden-import "pyrogram.connection" `
            --hidden-import "tgcrypto" `
            --hidden-import "grpc._cython.cygrpc" `
            --exclude-module "pkg_resources" `
            --exclude-module "setuptools" `
            --collect-all "pyrogram" `
            --collect-all "google.protobuf" `
            --collect-submodules "grpc" `
            atf.py
          7z a "assets\atf-${{ matrix.suffix }}-portable.zip" .\dist\atf

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.suffix }}
          path: assets/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Go REST API binary — tiny, static, every platform.
  # ------------------------------------------------------------------------ #
  api-binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux,   goarch: amd64, suffix: linux-x64}
          - {os: ubuntu-latest, goos: linux,   goarch: arm64, suffix: linux-arm64}
          # NOTE: darwin binaries are cross-compiled from ubuntu-latest on
          # purpose (CGO_ENABLED=0 static build). Previous revisions used
          # macos-latest here and were cancelled by runner capacity limits
          # ("job was not acquired by Runner of type hosted"), which turned
          # the whole run red and skipped publish.
          - {os: ubuntu-latest, goos: darwin,  goarch: amd64, suffix: macos-x64}
          - {os: ubuntu-latest, goos: darwin,  goarch: arm64, suffix: macos-arm64}
          - {os: windows-latest, goos: windows, goarch: amd64, suffix: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build static API binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          cd api
          go build -trimpath -ldflags "-s -w" -o "../atf-api-${{ matrix.suffix }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .
          cd ..
          ls -la atf-api-*

      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.suffix }}
          path: atf-api-*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Multi-arch Docker images — the "runs anywhere" path (k8s, NAS, VPS).
  # ------------------------------------------------------------------------ #
  docker:
    needs: meta
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase repository owner
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Build & push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-core:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-core:${{ needs.meta.outputs.version }}

      - name: Logger image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.logger
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-logger:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-logger:${{ needs.meta.outputs.version }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-api:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-api:${{ needs.meta.outputs.version }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-web:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-web:${{ needs.meta.outputs.version }}

  # ------------------------------------------------------------------------ #
  # Portable source bundle — the no-binary path (any POSIX box).
  # ------------------------------------------------------------------------ #
  portable:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build portable tarball
        run: |
          NAME="autotelegramforward-${{ needs.meta.outputs.version }}-portable"
          mkdir -p "artifacts/${NAME}"
          tar --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
              --exclude='.pytest_cache' --exclude='data/*.db*' \
              --exclude='*.log' --exclude='dist' --exclude='build' \
              --exclude='web/frontend/node_modules' --exclude='web/backend/target' \
              -cf - atf.py core logger proto api web k8s scripts \
                     install.sh install.ps1 requirements.txt VERSION \
                     config.example.yaml docker-compose.yml \
                     Dockerfile.core Dockerfile.logger Dockerfile.api Dockerfile.web \
                     README.md docs \
              | tar -xf - -C "artifacts/${NAME}"
          tar -czf "artifacts/${NAME}.tar.gz" -C artifacts "${NAME}"
          sha256sum "artifacts/${NAME}.tar.gz" > "artifacts/${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: artifacts/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Flutter mobile app — Android APKs. iOS builds need signing certs that do
  # not exist in this repo's secrets, so only Android is published here.
  # ------------------------------------------------------------------------ #
  mobile-android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Run mobile tests
        working-directory: mobile
        run: flutter test

      - name: Analyze mobile code
        working-directory: mobile
        run: flutter analyze

      - name: Build release APKs (split per ABI)
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi
          # NOTE: working-directory is $GITHUB_WORKSPACE/mobile, so the
          # staging dir is ../atf-mobile (= $GITHUB_WORKSPACE/atf-mobile),
          # matching the upload-artifact path below. Do NOT use ../../ here.
          mkdir -p ../atf-mobile
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "../atf-mobile/AutoTelegramForward-${{ needs.meta.outputs.version }}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "../atf-mobile/AutoTelegramForward-${{ needs.meta.outputs.version }}-android-armv7.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             "../atf-mobile/AutoTelegramForward-${{ needs.meta.outputs.version }}-android-x86_64.apk"
          (cd ../atf-mobile && sha256sum *.apk > SHA256SUMS-mobile.txt && ls -la)

      - name: Build release App Bundle (Play Store)
        working-directory: mobile
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab \
             "../atf-mobile/AutoTelegramForward-${{ needs.meta.outputs.version }}-android-bundle.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: atf-mobile/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # iOS simulator build (unsigned) — validates the Flutter iOS target on
  # every release without needing Apple signing certificates. Real devices
  # still need the signed-ios job below.
  # ------------------------------------------------------------------------ #
  ios-simulator:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Run mobile tests
        working-directory: mobile
        run: flutter test

      - name: Build iOS app for simulator (no codesign)
        working-directory: mobile
        run: flutter build ios --simulator --no-codesign

      - name: Stage simulator bundle
        working-directory: mobile
        run: |
          mkdir -p "../atf-ios-sim/AutoTelegramForward-${{ needs.meta.outputs.version }}-ios-simulator"
          cp -R build/ios/iphonesimulator/Runner.app \
            "../atf-ios-sim/AutoTelegramForward-${{ needs.meta.outputs.version }}-ios-simulator/Runner.app"
          (cd ../atf-ios-sim && find . -type f -exec shasum -a 256 {} \; > SHA256SUMS-ios-sim.txt && ls -la)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: atf-ios-sim/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Signed iOS IPA — runs ONLY when Apple signing secrets exist. Otherwise
  # the job resolves to a documented SKIP (its only step exits 0 without
  # producing anything); it never reports a fake successful build.
  # Required secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD,
  # IOS_PROVISION_PROFILE_BASE64, IOS_EXPORT_PLIST_BASE64.
  # ------------------------------------------------------------------------ #
  signed-ios:
    needs: meta
    runs-on: macos-latest
    env:
      HAS_IOS_SECRETS: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for iOS signing secrets
        id: gate
        shell: bash
        run: |
          if [ "${HAS_IOS_SECRETS}" != "true" ]; then
            echo "SKIP: iOS signing secrets (IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64, IOS_EXPORT_PLIST_BASE64) are not configured — signed IPA build skipped by design. See docs/mobile-release.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.gate.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Import signing certificate and profile
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_CERT_P12_BASE64" | base64 --decode -o /tmp/ios_dist.p12
          CERT_IDENTITY=$(security cms -D -i /tmp/ios_dist.p12 2>/dev/null | plutil -extract Certificates.0.T:name raw -o - - || true)
          echo "certificate present: ${CERT_IDENTITY:-unknown identity}"
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/ios_dist.p12 -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/atf.mobileprovision
          rm -f /tmp/ios_dist.p12

      - name: Build signed IPA
        if: steps.gate.outputs.skip != 'true'
        working-directory: mobile
        shell: bash
        env:
          IOS_EXPORT_PLIST_BASE64: ${{ secrets.IOS_EXPORT_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_EXPORT_PLIST_BASE64" | base64 --decode -o ios/ExportOptions.plist
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          mkdir -p ../atf-ios
          cp build/ios/ipa/*.ipa "../atf-ios/AutoTelegramForward-${{ needs.meta.outputs.version }}-ios.ipa"
          (cd ../atf-ios && shasum -a 256 *.ipa > SHA256SUMS-ios.txt && ls -la)
          rm -f ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: signed-ios
          path: atf-ios/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Manifest — scans every downloaded builder artifact and emits
  # release/manifest.json (versions, sha256 per file, required vs optional,
  # per-deliverable build status). Runs even if optional legs failed so the
  # manifest honestly records what is missing; enforcement (fail on missing
  # REQUIRED artifacts / sha mismatch) happens in verify_manifest.py, the
  # clean-install job, and post-publish-verify below.
  # ------------------------------------------------------------------------ #
  manifest:
    needs: [meta, binaries, api-binaries, docker, portable, mobile-android, ios-simulator, signed-ios]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all builder artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate manifest
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ls -la all-assets || true
          OWNER="${GITHUB_REPOSITORY_OWNER:-OWNER}"
          python3 scripts/release_manifest.py \
            --artifacts-dir all-assets \
            --output release/manifest.json \
            --commit-sha "${GITHUB_SHA}" \
            --owner "${OWNER}"
          cat release/manifest.json

      - name: Self-verify manifest (missing REQUIRED artifacts fail here)
        shell: bash
        run: python3 scripts/verify_manifest.py --manifest release/manifest.json --artifacts-dir all-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/manifest.json
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Clean-install check — proves a fresh checkout's compose stack boots and
  # both health endpoints answer, then tears everything down.
  # ------------------------------------------------------------------------ #
  clean-install:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for smoke test
        shell: bash
        run: |
          cp .env.example .env
          echo "compose smoke test uses placeholder credentials from .env.example"

      - name: Compose up
        shell: bash
        run: docker compose up -d --build

      - name: Poll health endpoints
        shell: bash
        run: |
          for i in $(seq 1 30); do
            A=$(curl -sf http://127.0.0.1:8088/healthz || true)
            B=$(curl -sf http://127.0.0.1:8080/api/v1/health/services || true)
            if [ -n "$A" ] && [ -n "$B" ]; then
              echo "web /healthz: $A"
              echo "api /api/v1/health/services: $B"
              echo "$B" | grep -q '"status"' && exit 0
            fi
            echo "waiting for stack... ($i/30)"
            sleep 10
          done
          echo "health endpoints never became ready"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Compose down (always)
        if: always()
        shell: bash
        run: docker compose down -v

  # ------------------------------------------------------------------------ #
  # Publish: assemble everything into a GitHub Release with notes.
  # ------------------------------------------------------------------------ #
  publish:
    # Publish gate: block only on real build failures. 'cancelled'/'skipped'
    # are tolerated because GitHub infra occasionally cancels macOS runners
    # for capacity ("not acquired by Runner of type hosted"); a re-run of the
    # failed jobs then fills the gaps, and a partially-cancelled matrix must
    # never block the whole release. fail-fast:false (set per matrix) keeps
    # one cancelled leg from cancelling the rest.
    # Infra-cancel tolerance lives ONLY in this gate: no job uses
    # continue-on-error to hide a real build failure (download steps use it
    # only because optional legs may legitimately be absent; the manifest
    # self-verify + post-publish-verify jobs enforce REQUIRED completeness).
    needs: [meta, binaries, api-binaries, portable, mobile-android, ios-simulator, manifest]
    if: |
      always() &&
      needs.meta.result == 'success' &&
      needs.binaries.result != 'failure' &&
      needs.api-binaries.result != 'failure' &&
      needs.mobile-android.result != 'failure' &&
      needs.manifest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'bin-*'
          path: all-assets
          merge-multiple: true

      - name: Download API binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'api-*'
          path: all-assets
          merge-multiple: true

      - name: Download mobile APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-android
          path: all-assets

      - name: Download portable bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: portable
          path: all-assets

      - name: Download iOS simulator bundle (optional leg)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-simulator
          path: all-assets

      - name: Download signed iOS IPA (optional leg)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: signed-ios
          path: all-assets

      - name: Download release manifest
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-manifest
          path: all-assets

      - name: Verify at least one artifact family present
        shell: bash
        run: |
          if [ ! -d all-assets ] || [ -z "$(ls -A all-assets 2>/dev/null)" ]; then
            echo "No artifacts downloaded at all — refusing to publish an empty release."
            exit 1
          fi
          ls -la all-assets

      - name: Flatten + merge checksums
        shell: bash
        run: |
          mkdir -p release
          find all-assets -type f -name 'atf*' -exec cp {} release/ \;
          find all-assets -type f -name 'autotelegramforward*' -exec cp {} release/ \;
          find all-assets -type f -name 'AutoTelegramForward-*.apk' -exec cp {} release/ \;
          find all-assets -type f -name 'AutoTelegramForward-*.aab' -exec cp {} release/ \;
          find all-assets -type f -name 'AutoTelegramForward-*-ios*.ipa' -exec cp {} release/ \;
          find all-assets -type f -name 'manifest.json' -exec cp {} release/ \;
          find all-assets -type f -name 'SHA256SUMS-*.txt' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          cat > NOTES.md <<EOF
          ## AutoTelegramForward v${VERSION} — True Single-File Cross-Platform Release

          **One Single Executable, All 4 Microservices.**
          AutoTelegramForward is a high-performance Telegram MTProto forwarding and routing suite engineered with clean microservice boundaries. Every platform release is a self-contained, native single executable that embeds and orchestrates all four decoupled services with zero external dependencies (no Python, Go, Rust, Node.js, or compiler toolchains required on host systems):

          1. **Python Core Engine (:6001)** — Telegram MTProto client pool, rule engine, smart routing, link sanitization, and multi-provider AI text transformations.
          2. **Python Logger Service (:6002)** — Telemetry, queryable structured logs with dedicated SQLite storage.
          3. **Go REST API (:8080)** — Production control-plane, OpenAPI REST endpoints for rules, sessions, and telemetry.
          4. **Rust Axum Web Gateway & React Dashboard (:8088)** — Zero-dependency web server embedding the React Single Page App, providing security headers, high-throughput reverse proxying to the Go API, and health metrics.

          ---

          ### Quick Start Guide (Linux / macOS / WSL)

          1. **Download the single-file binary:**
             \`\`\`bash
             curl -fsSL https://github.com/Opselon/AutoTelegramForward/releases/latest/download/atf-linux-x64 -o atf && chmod +x atf
             \`\`\`
             *(For Apple Silicon macOS, use \`atf-macos-arm64\`; for macOS Intel, use \`atf-macos-x64\`)*

          2. **Interactive Onboarding & Setup Wizard:**
             \`\`\`bash
             ./atf setup
             \`\`\`
             *Only asks for your Telegram Bot Token from [@BotFather](https://t.me/BotFather) and optional Admin User ID.*
             *To run non-interactively (CI/CD):*
             \`\`\`bash
             ./atf setup --token "123456:ABC-DEF..." --admin 123456789 --lang en --start
             \`\`\`

          3. **Start All Services with One Command:**
             \`\`\`bash
             ./atf start
             \`\`\`

          4. **Verify Live Status & Health:**
             \`\`\`bash
             ./atf status
             ./atf health
             \`\`\`

          5. **Open Web Dashboard:**
             Open \`http://localhost:8088\` in your browser to access the live React Management Dashboard.

          ---

          ### Windows (PowerShell)

          \`\`\`powershell
          curl.exe -fsSL https://github.com/Opselon/AutoTelegramForward/releases/latest/download/atf-windows-x64.exe -o atf.exe
          .\\atf.exe setup
          .\\atf.exe start
          .\\atf.exe status
          \`\`\`

          ---

          ### Production OS Background Service (Auto-Start on Boot)

          Run all services continuously in the background managed by your operating system:

          \`\`\`bash
          # Linux (systemd user unit)
          ./atf service install

          # Check service status
          ./atf status

          # Tail live service logs
          ./atf logs
          \`\`\`

          ---

          ### Docker & Kubernetes Deployments

          **Docker Compose (All 4 Microservices):**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Opselon/AutoTelegramForward/master/docker-compose.yml -o docker-compose.yml
          docker compose up -d
          # or via CLI:
          ./atf docker up
          \`\`\`

          **Kubernetes (Production Cluster Manifests):**
          \`\`\`bash
          ./atf k8s apply
          # or kubectl:
          kubectl apply -f https://raw.githubusercontent.com/Opselon/AutoTelegramForward/master/k8s/all-in-one.yaml
          \`\`\`

          ---

          ### Official Single-File Artifacts

          | Binary | Platform | Architecture | Verification |
          |---|---|---|---|
          | \`atf-linux-x64\` | Linux | x86_64 | Self-contained single-file executable |
          | \`atf-linux-arm64\` | Linux | ARM64 / aarch64 | Raspberry Pi 4/5, ARM VPS, Graviton |
          | \`atf-macos-x64\` | macOS | Intel x86_64 | Self-contained single-file executable |
          | \`atf-macos-arm64\` | macOS | Apple Silicon (M1/M2/M3/M4) | Self-contained single-file executable |
          | \`atf-windows-x64.exe\` | Windows | x64 | Windows native standalone executable |
          | \`atf-*-portable.tar.gz\` | Cross-platform | Portable directory | One-directory portable bundle |
          | `AutoTelegramForward-*-android-arm64.apk` | Android | ARM64 | Flutter release APK (per-ABI) |
          | `AutoTelegramForward-*-android-armv7.apk` | Android | ARMv7 | Flutter release APK (per-ABI) |
          | `AutoTelegramForward-*-android-x86_64.apk` | Android | x86_64 | Flutter release APK (per-ABI) |
          | `AutoTelegramForward-*-android-bundle.aab` | Android | Universal | Play Store App Bundle |
          | `autotelegramforward-*-portable.tar.gz` | Any POSIX | Source bundle | Source distribution |

          ### SHA-256 Checksums Verification
          Download \`SHA256SUMS.txt\` from the release assets and verify integrity:
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: AutoTelegramForward v${{ needs.meta.outputs.version }}
          body_path: NOTES.md
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true

  # ------------------------------------------------------------------------ #
  # Post-publish verify — downloads a sample of the just-published release
  # assets and re-checks sha256 against the published manifest. Catches
  # truncated uploads or asset mix-ups after the release exists.
  # ------------------------------------------------------------------------ #
  post-publish-verify:
    needs: [meta, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download published assets (sample)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify
          TAG="${{ needs.meta.outputs.tag }}"
          gh release download "$TAG" --dir verify --pattern 'manifest.json'
          # Sample: manifest + one binary per family + checksums index.
          gh release download "$TAG" --dir verify --pattern 'atf-linux-x64' || true
          gh release download "$TAG" --dir verify --pattern 'atf-api-linux-x64' || true
          gh release download "$TAG" --dir verify --pattern 'AutoTelegramForward-*-android-arm64.apk' || true
          gh release download "$TAG" --dir verify --pattern 'SHA256SUMS.txt'
          ls -la verify

      - name: Re-check sample sha256 against manifest
        shell: bash
        run: python3 scripts/verify_manifest.py --manifest verify/manifest.json --artifacts-dir verify --sample 4
