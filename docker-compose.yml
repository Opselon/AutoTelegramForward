services:
  # Production logging engine (Rust, rust/logger). Promoted over the legacy
  # Python logger: the service name and the `logger:50052` address consumers use
  # are unchanged, so core/api needed no client change. Owns its own store
  # (logger-rust-data); the retired Python archive (atf-data/logger.db) is kept
  # intact as a historical record and is never written to again.
  logger:
    build:
      context: .
      dockerfile: Dockerfile.logger-rust
    container_name: atf-logger
    restart: unless-stopped
    environment:
      ATF_LOGGER_DB_PATH: /app/data/atf_logs_rust.db
      # Bound to all interfaces so the container healthcheck and an operator's
      # scrape both reach it; the crate's own default is loopback-only.
      ATF_LOGGER_METRICS_LISTEN: 0.0.0.0:9109
    volumes:
      - logger-rust-data:/app/data
    networks:
      - atf-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9109/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: atf-core
    restart: unless-stopped
    depends_on:
      - logger
    environment:
      ATF_API_ID: ${ATF_API_ID}
      ATF_API_HASH: ${ATF_API_HASH}
      ATF_BOT_TOKEN: ${ATF_BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-5094837833}
      ADMIN_IDS: ${ADMIN_IDS:-5094837833}
      ATF_ADMIN_USER_ID: ${ATF_ADMIN_USER_ID:-5094837833}
      ATF_MASTER_KEY: ${ATF_MASTER_KEY}
      # Public dashboard URL the bot shows in its panel (e.g. https://panel.example.com
      # or http://203.0.113.10:8088). Inside Docker the container cannot detect
      # the host's public address, so set it here — or leave blank and configure
      # it from the bot's "Dashboard URL" button.
      ATF_WEB_URL: ${ATF_WEB_URL:-}
      ATF_GRPC_PORT: 50051
      ATF_DB_PATH: /app/data/atf.db
      ATF_LOGGER_ADDR: logger:50052
    volumes:
      - atf-data:/app/data
    networks:
      - atf-net
      # The AI rewrite provider (9router) runs as a sibling stack, published on
      # its own bridge network. Without this the core cannot resolve/connect to
      # `9router` and every AI rewrite fails with PROVIDER_ERROR (seen as
      # "AI rewrite does nothing"), so the AI base_url is http://9router:20128/v1.
      - ai-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atf-api
    restart: unless-stopped
    depends_on:
      - core
    environment:
      ATF_CORE_GRPC: core:50051
      ATF_LOGGER_GRPC: logger:50052
      ATF_API_ADDR: ":8080"
      ATF_API_KEY: ${ATF_API_KEY:-}
      # The web gateway runs in its own container, so the health handler must
      # probe it over the compose network, not 127.0.0.1:8088 (nothing listens
      # there inside the api container, and /api/v1/health/services would
      # otherwise report the gateway as down).
      ATF_WEB_HEALTH_URL: http://web:8088/healthz
    ports:
      - "8080:8080"
    networks:
      - atf-net
      # Same reason as `core`: the preflight diagnostics probe runs inside THIS
      # container, so if the api cannot resolve `9router` the AI endpoint check
      # fails with `lookup 9router on 127.0.0.11:53: server misbehaving` and
      # reports every AI config as unreachable even though rewrites succeed.
      - ai-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: atf-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ATF_WEB_ADDR: "0.0.0.0:8088"
      ATF_API_ADDR: "http://api:8080"
    ports:
      - "8088:8088"
    networks:
      - atf-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Optional TLS reverse proxy. Enable with --profile tls (see docs/tls.md):
  #   docker compose --profile tls up -d
  # Caddy provisions a Let's Encrypt certificate automatically for
  # ATF_TLS_DOMAIN and terminates TLS for the dashboard.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: atf-caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      ATF_TLS_DOMAIN: ${ATF_TLS_DOMAIN:-localhost}
      ATF_TLS_EMAIL: ${ATF_TLS_EMAIL:-}
      ATF_WEB_INTERNAL_ADDR: http://web:8088
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - atf-net

volumes:
  atf-data:
  logger-rust-data:
  caddy-data:
  caddy-config:

networks:
  atf-net:
    driver: bridge
  # Pre-existing network of the self-hosted 9router AI gateway. Marked external
  # because it is owned by that stack, not by this compose project.
  ai-net:
    external: true
    name: 9router_default
