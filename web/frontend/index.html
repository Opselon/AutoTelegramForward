<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark" />
    <title>AutoTelegramForward PRO | Smart Gateway & Control Panel</title>
    <!-- The shell pins lang/dir from the stored preference before the first
         paint (src/main.tsx). This element no longer claims Persian: that
         shipped an RTL document, and a Persian loading line, to every reader. -->
    <script>
      /* Pre-paint direction: avoids a left-to-right flash for Persian readers. */
      try {
        var stored = localStorage.getItem('atf_lang') || navigator.language || 'en'
        var code = String(stored).toLowerCase().split(/[-_]/)[0]
        var supported = ['en', 'fa', 'pt', 'uz', 'ru', 'id', 'es', 'fr', 'it', 'zh']
        if (supported.indexOf(code) === -1) code = 'en'
        document.documentElement.lang = code
        document.documentElement.dir = code === 'fa' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
    <!-- Non-blocking font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" />
    </noscript>
    <style>
      /* Zero-delay splash fallback while bundle parses */
      body {
        margin: 0;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
        padding: 20px;
        text-align: center;
      }
      .app-initial-brand {
        font-size: 1.1rem;
        font-weight: 700;
        color: #818cf8;
        letter-spacing: -0.01em;
      }
      .app-initial-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-spinner"></div>
        <div style="font-size: 1.1rem; font-weight: 700; color: #818cf8; letter-spacing: -0.01em;">AutoTelegramForward PRO</div>
        <div style="font-size: 0.85rem; color: #94a3b8;">در حال بارگذاری داشبورد هوشمند...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
