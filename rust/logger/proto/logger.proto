// Vendored subset of proto/autoforward.proto — the LogControlService surface
// only. Names, field numbers and types match the canonical file exactly so the
// existing Python (core/observability/log_client.py) and Go clients keep working unchanged.
//
// Do not renumber or rename anything here: the wire format is shared.

syntax = "proto3";

package autoforward;

message StatusResponse {
  bool success = 1;
  string message = 2;
  string error_code = 3;
}

message LogEntry {
  int64 ts = 1;
  string level = 2;
  string service = 3;
  string category = 4;
  string message = 5;
  string detail = 6;
  string rule_id = 7;
  int64 user_id = 8;
  string correlation_id = 9;
  // ---- Structured context (additive; field numbers 10-12 are unused above) ----
  // A producer that predates these fields sends nothing, the engine stores '',
  // and every existing read path answers exactly as before.
  string request_id = 10; // one API request / bot update, when it differs from correlation_id
  string trace_id = 11;   // W3C trace id shared across services (32 hex, or 16 on legacy)
  string module = 12;     // the file/module that emitted the event ("handler.forward")
  // Engine-computed error signature, returned on reads and ignored on writes: a
  // client can group "the same failure" without re-deriving the normalisation.
  string fingerprint = 13;
}

message LogRequest {
  LogEntry entry = 1;
}

message QueryLogsRequest {
  string level = 1;
  string service = 2;
  string category = 3;
  string search = 4;
  int32 limit = 5;
  int64 since = 6;
  string rule_id = 7;
  int64 until = 8;
  int32 offset = 9;
  bool ascending = 10;
  repeated string levels = 11;
  int64 user_id = 12;
  string correlation_id = 13;
  // ---- Structured context (additive) ----
  // Exact-match lookups, not substring: they are indexed columns.
  string trace_id = 14;
  string request_id = 15;
  // Every occurrence of one error signature: see `LogEntry.fingerprint` /
  // LogStatsResponse.by_fingerprint for what a fingerprint is.
  string fingerprint = 16;
}

message PurgeLogsRequest {
  string level = 1;
  string service = 2;
  string category = 3;
  int64 older_than_hours = 4;
  string rule_id = 5;
}

message PurgeLogsResponse {
  bool success = 1;
  int64 purged = 2;
  int64 remaining = 3;
  string error = 4;
}

message QueryLogsResponse {
  repeated LogEntry logs = 1;
  int32 total = 2;
  bool has_more = 3;
}

message LogStatsRequest {
  string rule_id = 1;
  int64 user_id = 2;
  // Additive: when true, the answer also carries the recurring-error groups
  // (LogStatsResponse.error_groups). An old client sends nothing and pays for
  // the base aggregates only, exactly as before.
  bool include_errors = 3;
}

message LogStatsResponse {
  int64 total = 1;
  map<string, int32> by_level = 2;
  map<string, int32> by_category = 3;
  map<string, int32> by_rule = 4;    // v18: which task produced how much
  map<string, int32> by_service = 5; // v18: which service produced how much
  int64 oldest_ts = 6;               // v18: how far back history actually goes
  int64 newest_ts = 7;               // v18: newest record on disk
  // ---- Error aggregation (additive) ----
  // Recurring-error groups: the identifying fields of a failing event plus how
  // often and how recently it fired. Bounded to `MAX_ERROR_GROUPS` entries
  // so a producer that invents a message per request cannot grow the response.
  repeated ErrorGroup error_groups = 8;
  // ---- Engine admission (additive, v20) ----
  // The engine's own admission policy and its filtered counters, so a control
  // plane can show why a *collected* event never became a queryable row
  // without scraping /metrics. An older client ignores the field.
  AdmissionPolicy admission = 9;
}

// What the logger engine itself admits, in its own words. Must stay
// byte-compatible with the same message in proto/autoforward.proto.
message AdmissionPolicy {
  repeated string collect_levels = 1;
  repeated string omitted_levels = 2;
  string configured_by = 3;
  int64 filtered_total = 4;
  map<string, int64> filtered_by_level = 5;
  bool collect_unknown = 6;
}

// One recurring-error signature, for the "same failure, N times" view.
message ErrorGroup {
  string fingerprint = 1;  // engine-computed signature id (category+module+
                           // number-masked message; severity/service reported, not hashed)
  string level = 2;
  string service = 3;
  string category = 4;
  string module = 5;
  string message = 6;      // the *first* occurrence's message, truncated to 512 chars
  int64 count = 7;
  int64 first_ts = 8;
  int64 last_ts = 9;
}

service LogControlService {
  rpc Log(LogRequest) returns (StatusResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc LogStats(LogStatsRequest) returns (LogStatsResponse);
  rpc PurgeLogs(PurgeLogsRequest) returns (PurgeLogsResponse);
}
