# AutoTelegramForward — cross-platform release pipeline.
#
# Produces, for every tag (v*) and every manual dispatch:
#   * self-contained single-file `atf` binaries — the ONE entry point that
#     manages every service (core + logger + api) — for
#     Linux / macOS / Windows on x86_64 + arm64
#   * the Go REST API as a static binary for the same matrix
#   * a multi-arch (amd64 + arm64) Docker image per service
#   * a portable source tarball (no toolchain needed to *download* it)
#   * SHA256SUMS.txt covering every artifact + a GitHub Release
#
# Single source of truth for the version number: the VERSION file at the
# repo root (also read by core/config.py and atf.py at runtime).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_tag:
        description: "Create a tag from this commit and release it"
        required: false
        default: "true"

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.27"

jobs:
  # ------------------------------------------------------------------------ #
  # Resolve the version once; every artifact inherits it.
  # ------------------------------------------------------------------------ #
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "${VERSION}" ]; then
            echo "VERSION file is empty"; exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "${TAG#v}" != "${VERSION}" ]; then
              echo "Tag ${TAG} does not match VERSION ${VERSION}"; exit 1
            fi
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  # ------------------------------------------------------------------------ #
  # Single-file binaries. PyInstaller freezes the whole app + interpreter into
  # one executable; the CLI supervises every microservice from inside it.
  # ------------------------------------------------------------------------ #
  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,   suffix: linux-x64,    label: Linux x86_64}
          - {os: ubuntu-24.04-arm, suffix: linux-arm64, label: Linux arm64}
          - {os: macos-latest,    suffix: macos-x64,    label: macOS Intel}
          - {os: macos-latest,    suffix: macos-arm64,  label: macOS Apple Silicon}
          - {os: windows-latest,  suffix: windows-x64,  label: Windows x64}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev libssl-dev patchelf

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi openssl || true

      - name: Build Go REST API
        shell: bash
        run: |
          mkdir -p bin
          cd api
          go build -trimpath -ldflags "-s -w" -o "../bin/atf-api${{ runner.os == 'Windows' && '.exe' || '' }}" .
          cd ..
          ls -la bin/

      - name: Build React Web Frontend
        shell: bash
        run: |
          cd web/frontend
          npm ci || npm install
          npm run build
          cd ../..

      - name: Build Rust Web Gateway
        shell: bash
        run: |
          cd web/backend
          cargo build --release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/atf-web-backend.exe ../../bin/atf-web-backend.exe
          else
            cp target/release/atf-web-backend ../../bin/atf-web-backend
          fi
          cd ../..
          ls -la bin/

      - name: Install PyInstaller + requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Ensure protobuf python stubs exist
        run: |
          if [ ! -f core/proto/autoforward_pb2.py ]; then
            python -m pip install --quiet grpcio-tools
            python scripts/gen_proto.py || true
          fi
        shell: bash

      - name: Stamp version into the bundle
        shell: bash
        run: |
          mkdir -p assets
          cp VERSION assets/VERSION

      - name: Freeze single-file CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --name "atf" \
            --add-data "VERSION:." \
            --add-data "core/proto:core/proto" \
            --add-data "logger:logger" \
            --add-data "proto:proto" \
            --add-data "config.example.yaml:." \
            --add-binary "bin/atf-api:." \
            --add-binary "bin/atf-web-backend:." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          chmod +x dist/atf
          ./dist/atf version
          cp dist/atf "assets/atf-${{ matrix.suffix }}"

      - name: Freeze single-file CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name "atf" \
            --add-data "VERSION;." \
            --add-data "core/proto;core/proto" \
            --add-data "logger;logger" \
            --add-data "proto;proto" \
            --add-data "config.example.yaml;." \
            --add-binary "bin/atf-api.exe;." \
            --add-binary "bin/atf-web-backend.exe;." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          ./dist/atf.exe version
          cp dist/atf.exe "assets/atf-${{ matrix.suffix }}.exe"

      - name: Freeze one-dir bundle (POSIX)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --name "atf" \
            --add-data "VERSION:." \
            --add-data "core/proto:core/proto" \
            --add-data "logger:logger" \
            --add-data "proto:proto" \
            --add-data "config.example.yaml:." \
            --hidden-import "pyrogram" \
            --hidden-import "pyrogram.session" \
            --hidden-import "pyrogram.connection" \
            --hidden-import "tgcrypto" \
            --hidden-import "grpc._cython.cygrpc" \
            --exclude-module "pkg_resources" \
            --exclude-module "setuptools" \
            --collect-all "pyrogram" \
            --collect-all "google.protobuf" \
            --collect-submodules "grpc" \
            atf.py
          tar -czf "assets/atf-${{ matrix.suffix }}-portable.tar.gz" -C dist atf

      - name: Freeze one-dir bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --name "atf" `
            --add-data "VERSION;." `
            --add-data "core/proto;core/proto" `
            --add-data "logger;logger" `
            --add-data "proto;proto" `
            --add-data "config.example.yaml;." `
            --hidden-import "pyrogram" `
            --hidden-import "pyrogram.session" `
            --hidden-import "pyrogram.connection" `
            --hidden-import "tgcrypto" `
            --hidden-import "grpc._cython.cygrpc" `
            --exclude-module "pkg_resources" `
            --exclude-module "setuptools" `
            --collect-all "pyrogram" `
            --collect-all "google.protobuf" `
            --collect-submodules "grpc" `
            atf.py
          7z a "assets\atf-${{ matrix.suffix }}-portable.zip" .\dist\atf

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.suffix }}
          path: assets/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Go REST API binary — tiny, static, every platform.
  # ------------------------------------------------------------------------ #
  api-binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux,   goarch: amd64, suffix: linux-x64}
          - {os: ubuntu-latest, goos: linux,   goarch: arm64, suffix: linux-arm64}
          - {os: macos-latest,  goos: darwin,  goarch: amd64, suffix: macos-x64}
          - {os: macos-latest,  goos: darwin,  goarch: arm64, suffix: macos-arm64}
          - {os: windows-latest, goos: windows, goarch: amd64, suffix: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build static API binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          cd api
          go build -trimpath -ldflags "-s -w" -o "../atf-api-${{ matrix.suffix }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .
          cd ..
          ls -la atf-api-*

      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.suffix }}
          path: atf-api-*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Multi-arch Docker images — the "runs anywhere" path (k8s, NAS, VPS).
  # ------------------------------------------------------------------------ #
  docker:
    needs: meta
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase repository owner
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Build & push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-core:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-core:${{ needs.meta.outputs.version }}

      - name: Logger image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.logger
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-logger:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-logger:${{ needs.meta.outputs.version }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-api:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-api:${{ needs.meta.outputs.version }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-web:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/atf-web:${{ needs.meta.outputs.version }}

  # ------------------------------------------------------------------------ #
  # Portable source bundle — the no-binary path (any POSIX box).
  # ------------------------------------------------------------------------ #
  portable:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build portable tarball
        run: |
          NAME="autotelegramforward-${{ needs.meta.outputs.version }}-portable"
          mkdir -p "artifacts/${NAME}"
          tar --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
              --exclude='.pytest_cache' --exclude='data/*.db*' \
              --exclude='*.log' --exclude='dist' --exclude='build' \
              --exclude='web/frontend/node_modules' --exclude='web/backend/target' \
              -cf - atf.py core logger proto api web k8s scripts \
                     install.sh install.ps1 requirements.txt VERSION \
                     config.example.yaml docker-compose.yml \
                     Dockerfile.core Dockerfile.logger Dockerfile.api Dockerfile.web \
                     README.md docs \
              | tar -xf - -C "artifacts/${NAME}"
          tar -czf "artifacts/${NAME}.tar.gz" -C artifacts "${NAME}"
          sha256sum "artifacts/${NAME}.tar.gz" > "artifacts/${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: artifacts/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Publish: assemble everything into a GitHub Release with notes.
  # ------------------------------------------------------------------------ #
  publish:
    needs: [meta, binaries, api-binaries, portable]
    if: |
      always() &&
      needs.meta.result == 'success' &&
      (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') &&
      (needs.api-binaries.result == 'success' || needs.api-binaries.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: 'bin-*'
          path: all-assets
          merge-multiple: true

      - name: Download API binaries
        uses: actions/download-artifact@v4
        with:
          pattern: 'api-*'
          path: all-assets
          merge-multiple: true

      - name: Download portable bundle
        uses: actions/download-artifact@v4
        with:
          name: portable
          path: all-assets

      - name: Flatten + merge checksums
        shell: bash
        run: |
          mkdir -p release
          find all-assets -type f -name 'atf*' -exec cp {} release/ \;
          find all-assets -type f -name 'autotelegramforward*' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          cat > NOTES.md <<EOF
          ## AutoTelegramForward v${VERSION} — True Single-File Cross-Platform Release

          **One Single Executable, All 4 Microservices.**
          AutoTelegramForward is a high-performance Telegram MTProto forwarding and routing suite engineered with clean microservice boundaries. Every platform release is a self-contained, native single executable that embeds and orchestrates all four decoupled services with zero external dependencies (no Python, Go, Rust, Node.js, or compiler toolchains required on host systems):

          1. **Python Core Engine (:6001)** — Telegram MTProto client pool, rule engine, smart routing, link sanitization, and multi-provider AI text transformations.
          2. **Python Logger Service (:6002)** — Telemetry, queryable structured logs with dedicated SQLite storage.
          3. **Go REST API (:8080)** — Production control-plane, OpenAPI REST endpoints for rules, sessions, and telemetry.
          4. **Rust Axum Web Gateway & React Dashboard (:8088)** — Zero-dependency web server embedding the React Single Page App, providing security headers, high-throughput reverse proxying to the Go API, and health metrics.

          ---

          ### Quick Start Guide (Linux / macOS / WSL)

          1. **Download the single-file binary:**
             \`\`\`bash
             curl -fsSL https://github.com/Opselon/AutoTelegramForward/releases/latest/download/atf-linux-x64 -o atf && chmod +x atf
             \`\`\`
             *(For Apple Silicon macOS, use \`atf-macos-arm64\`; for macOS Intel, use \`atf-macos-x64\`)*

          2. **Interactive Onboarding & Setup Wizard:**
             \`\`\`bash
             ./atf setup
             \`\`\`
             *Only asks for your Telegram Bot Token from [@BotFather](https://t.me/BotFather) and optional Admin User ID.*
             *To run non-interactively (CI/CD):*
             \`\`\`bash
             ./atf setup --token "123456:ABC-DEF..." --admin 123456789 --lang en --start
             \`\`\`

          3. **Start All Services with One Command:**
             \`\`\`bash
             ./atf start
             \`\`\`

          4. **Verify Live Status & Health:**
             \`\`\`bash
             ./atf status
             ./atf health
             \`\`\`

          5. **Open Web Dashboard:**
             Open \`http://localhost:8088\` in your browser to access the live React Management Dashboard.

          ---

          ### Windows (PowerShell)

          \`\`\`powershell
          curl.exe -fsSL https://github.com/Opselon/AutoTelegramForward/releases/latest/download/atf-windows-x64.exe -o atf.exe
          .\\atf.exe setup
          .\\atf.exe start
          .\\atf.exe status
          \`\`\`

          ---

          ### Production OS Background Service (Auto-Start on Boot)

          Run all services continuously in the background managed by your operating system:

          \`\`\`bash
          # Linux (systemd user unit)
          ./atf service install

          # Check service status
          ./atf status

          # Tail live service logs
          ./atf logs
          \`\`\`

          ---

          ### Docker & Kubernetes Deployments

          **Docker Compose (All 4 Microservices):**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Opselon/AutoTelegramForward/master/docker-compose.yml -o docker-compose.yml
          docker compose up -d
          # or via CLI:
          ./atf docker up
          \`\`\`

          **Kubernetes (Production Cluster Manifests):**
          \`\`\`bash
          ./atf k8s apply
          # or kubectl:
          kubectl apply -f https://raw.githubusercontent.com/Opselon/AutoTelegramForward/master/k8s/all-in-one.yaml
          \`\`\`

          ---

          ### Official Single-File Artifacts

          | Binary | Platform | Architecture | Verification |
          |---|---|---|---|
          | \`atf-linux-x64\` | Linux | x86_64 | Self-contained single-file executable |
          | \`atf-linux-arm64\` | Linux | ARM64 / aarch64 | Raspberry Pi 4/5, ARM VPS, Graviton |
          | \`atf-macos-x64\` | macOS | Intel x86_64 | Self-contained single-file executable |
          | \`atf-macos-arm64\` | macOS | Apple Silicon (M1/M2/M3/M4) | Self-contained single-file executable |
          | \`atf-windows-x64.exe\` | Windows | x64 | Windows native standalone executable |
          | \`atf-*-portable.tar.gz\` | Cross-platform | Portable directory | One-directory portable bundle |
          | \`autotelegramforward-*-portable.tar.gz\` | Any POSIX | Source bundle | Source distribution |

          ### SHA-256 Checksums Verification
          Download \`SHA256SUMS.txt\` from the release assets and verify integrity:
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: AutoTelegramForward v${{ needs.meta.outputs.version }}
          body_path: NOTES.md
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true
