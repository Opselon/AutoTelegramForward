name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements.txt pins every version. Installing from it — not from
        # unpinned names — keeps CI testing the same dependency set that runs
        # in production, and stops an upstream release from silently breaking
        # CI (or fixing it locally while CI fails).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q core/tests logger/tests scripts/tests

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        working-directory: api
        run: go build ./...

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Test
        working-directory: api
        run: go test ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build core image
        run: docker build -f Dockerfile.core -t atf-core .

      - name: Build api image
        run: docker build -f Dockerfile.api -t atf-api .

      - name: Build logger image
        run: docker build -f Dockerfile.logger -t atf-logger .

      # The release workflow builds and pushes this image; a stale toolchain
      # pin here once broke a published release (rust:1.85 vs transitive deps
      # needing rustc >= 1.86). Keep this so the failure surfaces pre-merge.
      - name: Build web image
        run: docker build -f Dockerfile.web -t atf-web .

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Check formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Compile Android Gradle target
        working-directory: mobile
        run: flutter build apk --debug
