# TEMPORARY one-shot formatting job for the PR branch. This file is deleted
# immediately after it has produced the dart-format commit — it is not part
# of the feature.
name: Temporary dart format
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/branding-suite-upgrade
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: dart format
        working-directory: mobile
        run: dart format .
      - name: Commit formatted files
        working-directory: mobile
        run: |
          git config user.name "Opselon"
          git config user.email "opselon@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already formatted"
            exit 0
          fi
          git commit -m "style(mobile): dart format the PR's Dart files"
          git push origin feat/branding-suite-upgrade
